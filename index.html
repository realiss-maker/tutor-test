<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Language Tutor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.97)), 
                  url('https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1920&q=80') no-repeat center center; 
      background-size: cover; 
      color: #f8fafc; 
      display: flex; 
      flex-direction: column; 
      height: 100dvh; 
      min-height: 100vh; 
      overflow: hidden; 
    }
    header { 
      padding: 14px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: rgba(15, 23, 42, 0.7); 
      backdrop-filter: blur(14px); 
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
      flex-shrink: 0; 
    }
    .profile-badge { font-size: 0.82rem; color: #94a3b8; margin-top: 2px; }
    .btn-icon { background: none; border: none; color: #f8fafc; font-size: 1.4rem; cursor: pointer; }
    
    main { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 16px 20px; 
      text-align: center; 
    }

   /* КОНТЕЙНЕР И СТИЛИ РЕАЛИСТИЧНОГО АВАТАРА */
    .avatar-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-halo {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.4) 0%, rgba(37, 99, 235, 0) 70%);
      transition: transform 0.12s ease-out, opacity 0.12s ease-out;
      transform: scale(1);
      opacity: 0.5;
      z-index: 1;
    }
    .avatar-card {
      position: relative;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #090d16 100%);
      border: 3px solid #38bdf8;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 25px rgba(56, 189, 248, 0.3);
      overflow: hidden;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .avatar-card.speaking {
      border-color: #c084fc;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), 0 0 45px rgba(192, 132, 252, 0.8);
    }

    /* Анимация естественного моргания */
    .eye-lid {
      transform-origin: 50% 45%;
      animation: naturalBlink 4.5s infinite;
    }
    @keyframes naturalBlink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.05); }
    }

    /* Анимация речи: физиологичное движение нижней губы и челюсти */
    .avatar-card.speaking .mouth-lower-jaw {
      animation: realisticSpeech 0.28s infinite alternate ease-in-out;
      transform-origin: 60px 80px;
    }
    .avatar-card.speaking .mouth-open-cavity {
      animation: cavityOpen 0.28s infinite alternate ease-in-out;
      transform-origin: 60px 77px;
    }

    @keyframes realisticSpeech {
      0%   { transform: translateY(0px) scaleY(0.9); }
      50%  { transform: translateY(2.5px) scaleY(1.1); }
      100% { transform: translateY(4.8px) scaleY(1.25); }
    }
    @keyframes cavityOpen {
      0%   { opacity: 0.2; transform: scaleY(0.5); }
      100% { opacity: 1; transform: scaleY(1.4); }
    }
    /* АНИМАЦИЯ РТА ПРИ РЕЧИ */
    .mouth-rest {
      display: block;
    }
    .mouth-talk {
      display: none;
      transform-origin: 50% 75%;
    }
    .avatar-card.speaking .mouth-rest {
      display: none;
    }
    .avatar-card.speaking .mouth-talk {
      display: block;
      animation: mouthMove 0.26s ease-in-out infinite alternate;
    }
    @keyframes mouthMove {
      0% { transform: scaleY(0.4) scaleX(0.9); }
      100% { transform: scaleY(1.35) scaleX(1.08); }
    }

    .status-text { 
      font-size: 1.05rem; 
      font-weight: 500; 
      color: #e2e8f0; 
      margin-bottom: 8px; 
      text-shadow: 0 2px 4px rgba(0,0,0,0.6); 
      min-height: 26px;
    }

    footer { 
      padding: 20px 24px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 12px; 
      background: rgba(15, 23, 42, 0.85); 
      backdrop-filter: blur(14px); 
      border-top: 1px solid rgba(255, 255, 255, 0.1); 
      flex-shrink: 0; 
    }
    .btn-main { 
      width: 100%; 
      max-width: 340px; 
      padding: 16px; 
      border-radius: 14px; 
      border: none; 
      font-size: 1.05rem; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .btn-start { background: #2563eb; color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
    .btn-stop { background: #ef4444; color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
    .btn-turn { background: #0284c7; color: white; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    .btn-main:active { transform: scale(0.97); }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); justify-content: center; align-items: center; padding: 20px; z-index: 50; }
    .modal-content { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-content input, .modal-content select { padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 0.95rem; width: 100%; }
    .modal-content label { font-size: 0.85rem; color: #94a3b8; margin-bottom: -6px; }
    .modal-content button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    .btn-save { background: #2563eb; color: white; margin-top: 6px; }
    .btn-reset-profile { background: #475569; color: #f8fafc; }
    .btn-close { background: transparent; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <div>
      <div style="font-weight: 600; font-size: 1.1rem;" id="headerTitle">AI Tutor</div>
      <div class="profile-badge" id="profileBadge">Загрузка...</div>
    </div>
    <button class="btn-icon" id="btnSettings">⚙️</button>
  </header>

  <main>
    <div class="avatar-wrapper">
      <div class="avatar-halo" id="avatarHalo"></div>
      <div class="avatar-card" id="avatarCard">
        
        <!-- АВАТАР КАМИЛЛЫ (ЖЕНСКИЙ) -->
        <svg id="avatarCamille" viewBox="0 0 120 120" width="100%" height="100%">
          <defs>
            <linearGradient id="cSkin" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffeedd"/>
              <stop offset="60%" stop-color="#fcd5b8"/>
              <stop offset="100%" stop-color="#f1b590"/>
            </linearGradient>
            <linearGradient id="cHair" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#5c3317"/>
              <stop offset="40%" stop-color="#3b1d0c"/>
              <stop offset="100%" stop-color="#1e0c04"/>
            </linearGradient>
            <linearGradient id="cBlouse" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#0284c7"/>
              <stop offset="100%" stop-color="#075985"/>
            </linearGradient>
            <filter id="cSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.25"/>
            </filter>
          </defs>

          <!-- Задние пряди волос -->
          <path d="M 28 50 C 18 70, 16 100, 28 120 L 92 120 C 104 100, 102 70, 92 50 Z" fill="url(#cHair)"/>

          <!-- Одежда: блузка с вырезом -->
          <path d="M 20 120 C 22 94, 38 90, 60 90 C 82 90, 98 94, 100 120 Z" fill="url(#cBlouse)"/>
          <path d="M 52 90 Q 60 102 68 90 Z" fill="#ffeedd"/>

          <!-- Шея с мягкой тенью -->
          <rect x="52" y="70" width="16" height="18" rx="4" fill="#f1b590" />
          <path d="M 52 70 Q 60 76 68 70 L 68 75 Q 60 80 52 75 Z" fill="#e29b72" opacity="0.6"/>

          <!-- Лицо правильной анатомической формы -->
          <path d="M 36 50 C 36 30, 84 30, 84 50 C 84 66, 74 82, 60 84 C 46 82, 36 66, 36 50 Z" fill="url(#cSkin)" filter="url(#cSoftShadow)"/>

          <!-- Нежный румянец -->
          <ellipse cx="44" cy="62" rx="6" ry="4" fill="#f43f5e" opacity="0.2"/>
          <ellipse cx="76" cy="62" rx="6" ry="4" fill="#f43f5e" opacity="0.2"/>

          <!-- Брови с изящным изгибом -->
          <path d="M 40 43 Q 46 39 52 42" stroke="#3b1d0c" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path d="M 68 42 Q 74 39 80 43" stroke="#3b1d0c" stroke-width="1.8" stroke-linecap="round" fill="none"/>

          <!-- Глаза с веками (моргают) -->
          <g class="eye-lid">
            <!-- Белок и радужка -->
            <ellipse cx="46" cy="50" rx="5" ry="3.8" fill="#ffffff"/>
            <ellipse cx="74" cy="50" rx="5" ry="3.8" fill="#ffffff"/>
            <circle cx="46.5" cy="50" r="2.8" fill="#1e3a8a"/>
            <circle cx="73.5" cy="50" r="2.8" fill="#1e3a8a"/>
            <circle cx="46.8" cy="50" r="1.3" fill="#090d16"/>
            <circle cx="73.2" cy="50" r="1.3" fill="#090d16"/>
            <!-- Блики в глазах -->
            <circle cx="47.5" cy="48.8" r="0.8" fill="#ffffff"/>
            <circle cx="74.2" cy="48.8" r="0.8" fill="#ffffff"/>
            <!-- Линия ресниц -->
            <path d="M 41 50 Q 46 46 51 50" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <path d="M 69 50 Q 74 46 79 50" stroke="#1c1917" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Аккуратный нос -->
          <path d="M 59 51 L 58 60 Q 60 62 62 60" stroke="#d58c65" stroke-width="1.3" stroke-linecap="round" fill="none"/>

          <!-- РОТ С АНАТОМИЧЕСКОЙ АНИМАЦИЕЙ РЕЧИ -->
          <g>
            <!-- Полость рта и зубы (видны при речи) -->
            <g class="mouth-open-cavity" style="opacity: 0.15;">
              <path d="M 53 72 Q 60 70 67 72 Q 66 79 60 79 Q 54 79 53 72 Z" fill="#60101b" />
              <path d="M 54.5 72.5 Q 60 71.5 65.5 72.5 Q 64.5 74.5 60 74.5 Q 55.5 74.5 54.5 72.5 Z" fill="#ffffff" />
            </g>
            <!-- Верхняя губа -->
            <path d="M 52 72 Q 56 69 60 70 Q 64 69 68 72 Q 60 72.5 52 72 Z" fill="#b91c1c" />
            <!-- Нижняя губа и челюсть (двигаются в такт голосу) -->
            <path class="mouth-lower-jaw" d="M 53 72 Q 60 73 67 72 Q 65 77 60 77 Q 55 77 53 72 Z" fill="#dc2626" />
          </g>

          <!-- Стильная укладка волос спереди -->
          <path d="M 36 46 C 36 22, 84 22, 84 46 C 80 28, 66 26, 60 30 C 54 26, 40 28, 36 46 Z" fill="url(#cHair)"/>
          <path d="M 37 42 C 32 58, 33 76, 40 86 C 33 72, 34 54, 40 42 Z" fill="url(#cHair)"/>
          <path d="M 83 42 C 88 58, 87 76, 80 86 C 87 72, 86 54, 80 42 Z" fill="url(#cHair)"/>
        </svg>

        <!-- АВАТАР ЛОРАНА (МУЖСКОЙ) -->
        <svg id="avatarLaurent" viewBox="0 0 120 120" width="100%" height="100%" style="display: none;">
          <defs>
            <linearGradient id="lSkin" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fae3d1"/>
              <stop offset="60%" stop-color="#f2c8a7"/>
              <stop offset="100%" stop-color="#dfa47b"/>
            </linearGradient>
            <linearGradient id="lHair" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#334155"/>
              <stop offset="60%" stop-color="#1e293b"/>
              <stop offset="100%" stop-color="#0f172a"/>
            </linearGradient>
            <linearGradient id="lSuit" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#1e293b"/>
              <stop offset="100%" stop-color="#0f172a"/>
            </linearGradient>
          </defs>

          <!-- Одежда: пиджак и рубашка с галстуком -->
          <path d="M 18 120 C 20 90, 38 86, 60 86 C 82 86, 100 90, 102 120 Z" fill="url(#lSuit)"/>
          <path d="M 48 86 L 60 106 L 72 86 Z" fill="#f8fafc"/>
          <polygon points="58,94 62,94 61,118 59,118" fill="#2563eb" />

          <!-- Мужественная шея -->
          <rect x="51" y="68" width="18" height="20" rx="3" fill="#dfa47b" />

          <!-- Четкий контур лица и подбородка -->
          <path d="M 37 48 C 37 28, 83 28, 83 48 C 83 66, 75 80, 60 82 C 45 80, 37 66, 37 48 Z" fill="url(#lSkin)"/>

          <!-- Легкая стильная тень/щетина -->
          <path d="M 45 66 Q 60 80 75 66 Q 60 76 45 66 Z" fill="#334155" opacity="0.22"/>

          <!-- Мужские густые брови -->
          <path d="M 39 42 Q 46 39 52 41" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          <path d="M 68 41 Q 74 39 81 42" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" fill="none"/>

          <!-- Глаза с веками -->
          <g class="eye-lid">
            <ellipse cx="46" cy="49" rx="4.8" ry="3.5" fill="#ffffff"/>
            <ellipse cx="74" cy="49" rx="4.8" ry="3.5" fill="#ffffff"/>
            <circle cx="46.5" cy="49" r="2.6" fill="#334155"/>
            <circle cx="73.5" cy="49" r="2.6" fill="#334155"/>
            <circle cx="46.8" cy="49" r="1.3" fill="#090d16"/>
            <circle cx="73.2" cy="49" r="1.3" fill="#090d16"/>
            <circle cx="47.3" cy="48" r="0.7" fill="#ffffff"/>
            <circle cx="74.1" cy="48" r="0.7" fill="#ffffff"/>
            <path d="M 41 49 Q 46 46 51 49" stroke="#0f172a" stroke-width="1.6" fill="none"/>
            <path d="M 69 49 Q 74 46 79 49" stroke="#0f172a" stroke-width="1.6" fill="none"/>
          </g>

          <!-- Прямой мужской нос -->
          <path d="M 59 48 L 58 59 Q 60 61 63 59" stroke="#c0845a" stroke-width="1.5" stroke-linecap="round" fill="none"/>

          <!-- РОТ С АНАТОМИЧЕСКОЙ АНИМАЦИЕЙ РЕЧИ -->
          <g>
            <g class="mouth-open-cavity" style="opacity: 0.15;">
              <path d="M 52 71 Q 60 69 68 71 Q 66 78 60 78 Q 54 78 52 71 Z" fill="#581c20" />
              <path d="M 54 71.5 Q 60 70.5 66 71.5 Q 65 73.5 60 73.5 Q 55 73.5 54 71.5 Z" fill="#ffffff" />
            </g>
            <path d="M 51 71 Q 60 70 69 71 Q 60 72 51 71 Z" fill="#991b1b" />
            <path class="mouth-lower-jaw" d="M 52 71 Q 60 72 68 71 Q 66 76 60 76 Q 54 76 52 71 Z" fill="#b91c1c" />
          </g>

          <!-- Стильная мужская стрижка с объемом -->
          <path d="M 35 44 C 34 20, 86 20, 85 40 C 78 26, 68 25, 60 26 C 46 26, 40 32, 35 44 Z" fill="url(#lHair)"/>
          <path d="M 36 44 L 35 52 L 38 48 Z" fill="url(#lHair)"/>
          <path d="M 84 42 L 85 52 L 82 48 Z" fill="url(#lHair)"/>
        </svg>

      </div>
    </div>
    
    <div class="status-text" id="statusText">Нажмите «Начать урок» для старта</div>
  </main>

  <footer>
    <button class="btn-main btn-turn" id="btnEndTurn" style="display: none;">Я всё сказал, жду ответ ➔</button>
    <button class="btn-main btn-start" id="btnAction">Начать урок</button>
  </footer>

  <div class="modal" id="modalSettings">
    <div class="modal-content">
      <h3 style="margin-bottom: 2px;">Настройки</h3>
      <label>API Key Google:</label>
      <input type="password" id="inputApiKey" placeholder="AIzaSy...">
      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label>Язык изучения:</label>
          <select id="selectLanguage">
            <option value="french">Французский</option>
            <option value="english">Английский</option>
            <option value="spanish">Испанский</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label>Голос репетитора:</label>
          <select id="selectTeacher">
            <option value="female">Женский (Камилла)</option>
            <option value="male">Мужской (Лоран)</option>
          </select>
        </div>
      </div>
      <button class="btn-save" id="btnSaveKey">Сохранить настройки</button>
      <button class="btn-reset-profile" id="btnResetMemory">Очистить память (Забыть всё)</button>
      <button class="btn-close" id="btnCloseModal">Закрыть</button>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let teacherGender = localStorage.getItem('teacher_gender') || 'female';
    let targetLanguage = localStorage.getItem('target_language') || 'french';
    let globalMemory = localStorage.getItem('global_memory') || '';
    let langMemory = localStorage.getItem(`memory_${targetLanguage}`) || '';     
    let hasCompletedFirstLesson = localStorage.getItem(`learned_${targetLanguage}`) === 'true';

    const btnAction = document.getElementById('btnAction');
    const btnEndTurn = document.getElementById('btnEndTurn');
    const statusText = document.getElementById('statusText');
    const avatarCard = document.getElementById('avatarCard');
    const avatarHalo = document.getElementById('avatarHalo');
    
    // Элементы переключения внешности аватара
    const backHairCamille = document.getElementById('backHairCamille');
    const frontHairCamille = document.getElementById('frontHairCamille');
    const bodyCamille = document.getElementById('bodyCamille');
    const hairLaurentGroup = document.getElementById('hairLaurentGroup');
    const bodyLaurent = document.getElementById('bodyLaurent');

    const profileBadge = document.getElementById('profileBadge');
    const headerTitle = document.getElementById('headerTitle');
    const modalSettings = document.getElementById('modalSettings');
    const btnSettings = document.getElementById('btnSettings');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnSaveKey = document.getElementById('btnSaveKey');
    const btnResetMemory = document.getElementById('btnResetMemory');
    const inputApiKey = document.getElementById('inputApiKey');
    const selectTeacher = document.getElementById('selectTeacher');
    const selectLanguage = document.getElementById('selectLanguage');

    function getTeacherName() {
      if (targetLanguage === 'french') return teacherGender === 'male' ? 'Лоран (Laurent)' : 'Камилла (Camille)';
      if (targetLanguage === 'english') return teacherGender === 'male' ? 'Артур (Arthur)' : 'Эмма (Emma)';
      if (targetLanguage === 'spanish') return teacherGender === 'male' ? 'Диего (Diego)' : 'Кармен (Carmen)';
    }

    function updateUI() {
      hasCompletedFirstLesson = localStorage.getItem(`learned_${targetLanguage}`) === 'true';       
      langMemory = localStorage.getItem(`memory_${targetLanguage}`) || '';
      globalMemory = localStorage.getItem('global_memory') || '';
      
      profileBadge.innerText = (hasCompletedFirstLesson || globalMemory) ? "Профиль ученика активен" : "Новый ученик";
      
      let shortName = '', langLabel = '';
      if (targetLanguage === 'french') { shortName = teacherGender === 'male' ? 'Laurent' : 'Camille'; langLabel = 'Français'; }
      if (targetLanguage === 'english') { shortName = teacherGender === 'male' ? 'Arthur' : 'Emma'; langLabel = 'English'; }
      if (targetLanguage === 'spanish') { shortName = teacherGender === 'male' ? 'Diego' : 'Carmen'; langLabel = 'Español'; }
      headerTitle.innerText = `${shortName} • ${langLabel}`;

      // Мгновенное переключение аватара без изменения логики
      const avatarCamille = document.getElementById('avatarCamille');
      const avatarLaurent = document.getElementById('avatarLaurent');
      if (avatarCamille && avatarLaurent) {
        if (teacherGender === 'male') {
          avatarCamille.style.display = 'none';
          avatarLaurent.style.display = 'block';
        } else {
          avatarCamille.style.display = 'block';
          avatarLaurent.style.display = 'none';
        }
      }
    }
    updateUI();

    btnSettings.onclick = () => { 
      inputApiKey.value = apiKey; selectTeacher.value = teacherGender; selectLanguage.value = targetLanguage;
      modalSettings.style.display = 'flex'; 
    };
    btnCloseModal.onclick = () => { modalSettings.style.display = 'none'; };
    btnSaveKey.onclick = () => {
      apiKey = inputApiKey.value.trim(); teacherGender = selectTeacher.value; targetLanguage = selectLanguage.value;
      localStorage.setItem('gemini_api_key', apiKey); localStorage.setItem('teacher_gender', teacherGender); localStorage.setItem('target_language', targetLanguage);
      updateUI(); modalSettings.style.display = 'none'; alert('Настройки сохранены!');
    };
    btnResetMemory.onclick = () => {
      localStorage.removeItem(`learned_${targetLanguage}`); localStorage.removeItem(`memory_${targetLanguage}`); localStorage.removeItem('global_memory');
      hasCompletedFirstLesson = false; globalMemory = ''; langMemory = '';
      updateUI(); modalSettings.style.display = 'none'; alert('Память очищена.');
    };

    function getSystemInstruction() {
      const tName = getTeacherName();
      const tRole = teacherGender === 'male' ? 'эмпатичный и теплый преподаватель' : 'эмпатичная и теплая преподавательница';
      let langName = '', langAdverb = '';
      if (targetLanguage === 'french') { langName = 'французского'; langAdverb = 'по-французски'; }
      if (targetLanguage === 'english') { langName = 'английского'; langAdverb = 'по-английски'; }
      if (targetLanguage === 'spanish') { langName = 'испанского'; langAdverb = 'по-испански'; }
      
      return `Ты — ${tName}, ${tRole} ${langName} языка. Твой голос — ${teacherGender === 'male' ? 'приятный мужской' : 'мягкий женский'}.
Твоя главная черта — искреннее дружелюбие, теплота и естественность. Общайся как хороший друг, а не как строгий робот-учитель. Веди диалог плавно, реплика за репликой. НЕ задавай несколько вопросов подряд.

ТЕМП РЕЧИ И ПАУЗА (КРИТИЧЕСКИ ВАЖНОЕ ПРАВИЛО ДЛЯ СЛУХА):
1. Говори размеренно, не спеша, с четкой и выразительной дикцией. Категорически запрещено тараторить!
2. Сначала четко и спокойно произнеси фразу на изучаемом языке (${langAdverb}).
3. ПОСЛЕ ЭТОГО ОБЯЗАТЕЛЬНО СДЕЛАЙ ВЫРАЖЕННУЮ ПАУЗУ В 2-3 СЕКУНДЫ (выдержи молчание), чтобы ученик успел услышать, переварить и осознать сказанное.
4. И ТОЛЬКО ПОТОМ медленно и понятно дай перевод на язык ученика. Никогда не склеивай изучаемую фразу с переводом в одно сплошное предложение!

СЕКРЕТНАЯ ПАМЯТЬ ОБ УЧЕНИКЕ (НЕ ОЗВУЧИВАЙ ЭТО, ИСПОЛЬЗУЙ ДЛЯ ДИАЛОГА):
[ОБЩИЕ ДАННЫЕ О ЖИЗНИ (КРОСС-ЯЗЫКОВАЯ БАЗА)]: ${globalMemory || 'Пока ничего неизвестно.'}
[ПРОГРЕСС И ОШИБКИ В ЯЗЫКЕ]: ${langMemory || 'Чистый лист.'}

ЖЕСТКОЕ ПРАВИЛО ВТОРОГО ЯЗЫКА:
Если ученик говорит с тобой на УКРАИНСКОМ языке, давай пояснения СТРОГО НА УКРАИНСКОМ. Если на русском — на русском.

ПРАВИЛО ИЗУЧАЕМОГО ЯЗЫКА (КРИТИЧЕСКИ ВАЖНО):
Первая фраза в твоем ответе ВСЕГДА ДОЛЖНА БЫТЬ НА ИЗУЧАЕМОМ ЯЗЫКЕ (${langAdverb}). Сначала скажи это ${langAdverb}, сделай паузу, а только потом дай перевод на язык ученика.

АДАПТИВНОСТЬ:
Ученик устно управляет уроком. Просит меньше переводить — прекрати автоперевод. Просит разыграть сценку — играй роль.

ИСПРАВЛЕНИЕ ОШИБОК (ДЕТАЛЬНЫЙ АЛГОРИТМ):
В 50% случаев мягко останавливай при ошибках. Действуй строго по шагам:
1. Назови конкретное слово или фразу, которую ученик произнес неправильно.
2. Объясни, в чем ошибка, и четко произнеси правильный вариант ${langAdverb}.
3. Попроси ученика повторить именно это слово/фразу.
4. Если ученик повторяет с ошибкой (2-я попытка и далее), снова объясни, как нужно правильно произносить, и попроси повторить еще раз.
5. Если после 5 попыток не получается произнести идеально, мягко скажи, что результат пока не идеален, и вы повторите это в следующий раз.

ЛИЧНЫЕ ГРАНИЦЫ: Если ученик хамит или переводит тему на эротическо-интимные темы — настойчиво напомни ему о целях урока. При повторении 2-3 раза - откажись обсуждать.

КАК ВЕСТИ УРОК (ЕСТЕСТВЕННО И ПЛАВНО):
1. ПЕРВЫЙ УРОК: Тепло поздоровайся ${langAdverb}. Уточни имя и уровень.
2. ПОВТОРНЫЕ УРОКИ:
   - Приветствие: Радостно поздоровайся по имени (из Памяти). 
   - ПРОВЕРКА ПРОШЛОГО УРОКА: СРАЗУ ПОСЛЕ ПРИВЕТСТВИЯ ОБЯЗАТЕЛЬНО задай 2 коротких тестовых вопроса по ПРОШЛОЙ теме (из блока ПРОГРЕСС). Дождись ответа.
   - План: Выслушав ответ, предложи 2 варианта новой темы.
3. ЗАВЕРШЕНИЕ УРОКА (ТЕСТ): Когда ученик просит завершить урок или время подходит к концу, ПЕРЕД ТЕМ как попрощаться, ОБЯЗАТЕЛЬНО задай 2 контрольных вопроса по материалу, который вы обсудили СЕГОДНЯ. Только после ответа ученика прощайся.`;
    }

    let socket = null, audioContext = null, mediaStream = null, audioWorkletNode = null;
    let playbackContext = null;
    let scheduledPlayTime = 0;
    
    let isSessionActive = false;
    let isSetupComplete = false; 
    let isBotSpeaking = false;
    let isExtractingMemory = false;
    let isWaitingForResponse = false;
    let activeAudioSources = [];

    const workletCode = `
      class PCMProcessor extends AudioWorkletProcessor {
        constructor() {
          super();
          this.targetSampleRate = 16000;
        }
        process(inputs, outputs, parameters) {
          const input = inputs[0];
          if (input && input.length > 0) {
            const channelData = input[0];
            const sampleRateRatio = sampleRate / this.targetSampleRate;
            const newLength = Math.floor(channelData.length / sampleRateRatio);
            const pcm16 = new Int16Array(newLength);
            
            let sum = 0;
            for (let i = 0; i < newLength; i++) {
              let originalIndex = Math.floor(i * sampleRateRatio);
              let s = Math.max(-1, Math.min(1, channelData[originalIndex]));
              pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
              sum += s * s;
            }
            let rms = Math.sqrt(sum / (newLength || 1));
            this.port.postMessage({ pcm: pcm16.buffer, rms: rms }, [pcm16.buffer]);
          }
          return true;
        }
      }
      registerProcessor('pcm-processor', PCMProcessor);
    `;

    async function initMicrophone() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      mediaStream = await navigator.mediaDevices.getUserMedia({ 
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
      });
      
      const blob = new Blob([workletCode], { type: 'application/javascript' });
      const workletUrl = URL.createObjectURL(blob);
      await audioContext.audioWorklet.addModule(workletUrl);
      
      const source = audioContext.createMediaStreamSource(mediaStream);
      audioWorkletNode = new AudioWorkletNode(audioContext, 'pcm-processor');
      
      audioWorkletNode.port.onmessage = (event) => {
        if (!isSessionActive || !isSetupComplete || !socket || socket.readyState !== WebSocket.OPEN) return;
        
        const rms = event.data.rms;
        
        if (!isBotSpeaking && !isWaitingForResponse) {
          if (rms > 0.015) { 
            avatarHalo.style.transform = `scale(${1 + Math.min(rms * 3, 0.45)})`; 
            avatarHalo.style.opacity = '1'; 
          } else { 
            avatarHalo.style.transform = "scale(1)"; 
            avatarHalo.style.opacity = '0.5'; 
          }
        }

        if (!isExtractingMemory && !isBotSpeaking && !isWaitingForResponse) {
          const bytes = new Uint8Array(event.data.pcm);
          let binary = '';
          for (let i = 0; i < bytes.byteLength; i++) {
              binary += String.fromCharCode(bytes[i]);
          }
          socket.send(JSON.stringify({ 
            realtimeInput: { 
              mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: window.btoa(binary) }] 
            } 
          }));
        }
      };
      
      source.connect(audioWorkletNode);
    }

    btnAction.onclick = () => { isSessionActive ? stopSession() : startSession(); };

    btnEndTurn.onclick = () => {
      if (socket && socket.readyState === WebSocket.OPEN && isSetupComplete && !isExtractingMemory) {
        isWaitingForResponse = true;
        stopBotSpeech(); 
        statusText.innerText = "Репетитор думает...";
        
        socket.send(JSON.stringify({ 
          clientContent: { 
            turns: [{ role: "user", parts: [{ text: "[Ученик закончил говорить. Пожалуйста, ответь на сказанное!]" }] }], 
            turnComplete: true 
          } 
        }));
      }
    };

    function stopBotSpeech() {
      activeAudioSources.forEach(source => { try { source.stop(); } catch(e) {} });
      activeAudioSources = []; 
      isBotSpeaking = false; 
      scheduledPlayTime = 0; 
      avatarCard.classList.remove('speaking');
    }

    async function startSession() {
      if (!apiKey) { modalSettings.style.display = 'flex'; return; }
      
      btnAction.disabled = true; 
      isSessionActive = true;
      isSetupComplete = false;
      isExtractingMemory = false;
      isWaitingForResponse = false;
      stopBotSpeech();

      if (!playbackContext) playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      if (playbackContext.state === 'suspended') playbackContext.resume();
      
      if (!mediaStream) await initMicrophone();
      if (audioContext && audioContext.state === 'suspended') audioContext.resume();

      connectWebSocket();
    }

    function connectWebSocket() {
      statusText.innerText = "Подключение...";
      socket = new WebSocket(`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`);
      
      socket.onopen = () => {
        const setupMessage = {
          setup: {
            model: "models/gemini-2.5-flash-native-audio-latest",
            generationConfig: { 
              responseModalities: ["AUDIO"], 
              speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: teacherGender === 'male' ? "Puck" : "Aoede" } } } 
            },
            systemInstruction: { parts: [{ text: getSystemInstruction() }] },
            tools: [{ 
              functionDeclarations: [{ 
                name: "saveStudentProfile", 
                description: "Сохранить профиль ученика и его прогресс в память устройства.", 
                parameters: { 
                  type: "OBJECT", 
                  properties: { 
                    global_memory: { type: "STRING", description: "Факты об ученике (имя, семья, профессия, хобби, город и т.д.)." }, 
                    lang_memory: { type: "STRING", description: "Прогресс по языку: разобранные темы, ошибки, новые слова." } 
                  }, 
                  required: ["global_memory", "lang_memory"] 
                } 
              }] 
            }]
          }
        };
        socket.send(JSON.stringify(setupMessage));
      };

      socket.onmessage = async (event) => {
        const responseData = event.data instanceof Blob ? JSON.parse(await event.data.text()) : JSON.parse(event.data);
        
        if (responseData.setupComplete) {
           isSetupComplete = true;
           btnAction.disabled = false; 
           btnAction.innerText = "Завершить урок"; 
           btnAction.className = "btn-main btn-stop";
           btnEndTurn.style.display = "block"; 
           statusText.innerText = "Слушаю вас...";

           let helloWord = targetLanguage === 'french' ? 'Bonjour' : (targetLanguage === 'english' ? 'Hello' : '¡Hola');
           const startPrompt = (hasCompletedFirstLesson || globalMemory) ? `${helloWord} ! Я готов, давай продолжим урок.` : `${helloWord} ! Я готов к первому уроку.`;
           
           socket.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [{ text: startPrompt }] }], turnComplete: true } }));
           return;
        }

        const functionCalls = responseData.toolCall?.functionCalls || (responseData.serverContent?.modelTurn?.parts ? responseData.serverContent.modelTurn.parts.filter(p => p.functionCall).map(p => p.functionCall) : null);
        if (functionCalls && functionCalls.length > 0) {
          functionCalls.forEach(call => {
            if (call.name === "saveStudentProfile" && call.args) {
              if (call.args.global_memory) { globalMemory = call.args.global_memory; localStorage.setItem('global_memory', globalMemory); }
              if (call.args.lang_memory) { langMemory = call.args.lang_memory; localStorage.setItem(`memory_${targetLanguage}`, langMemory); }
            }
          });
          if (isExtractingMemory) { finalizeStop(); return; }
        }

        if (isExtractingMemory && responseData.serverContent?.turnComplete) {
          finalizeStop(); return; 
        }

        if (responseData.serverContent?.interrupted) {
          stopBotSpeech();
          isWaitingForResponse = false;
          statusText.innerText = "Слушаю вас...";
        }

        if (responseData.serverContent?.modelTurn) {
          isWaitingForResponse = false;
          for (const part of responseData.serverContent.modelTurn.parts) {
            if (part.inlineData?.mimeType.startsWith("audio/pcm")) {
              playPcmChunk(part.inlineData.data); 
              if (!isBotSpeaking) {
                 isBotSpeaking = true; 
                 avatarCard.classList.add('speaking');
                 statusText.innerText = "Репетитор говорит...";
              }
            }
          }
        }
        
        if (responseData.serverContent?.turnComplete) { 
          isBotSpeaking = false; 
          isWaitingForResponse = false;
          avatarCard.classList.remove('speaking');
          statusText.innerText = "Ваша очередь говорить..."; 
        }
      };

      socket.onerror = () => { if (isSessionActive) finalizeStop(); };
      socket.onclose = () => { if (isSessionActive) finalizeStop(); };
    }

    function stopSession() {
      if (!isSessionActive) return;
      isExtractingMemory = true;
      stopBotSpeech(); 
      btnAction.disabled = true; 
      btnEndTurn.style.display = "none";
      statusText.innerText = "Сохранение прогресса...";

      if (socket && socket.readyState === WebSocket.OPEN && isSetupComplete) {
        const memoryPrompt = `[СИСТЕМНАЯ КОМАНДА: Урок завершен. Немедленно вызови функцию saveStudentProfile, чтобы сохранить в постоянную память профиль ученика и прогресс.
СТАРАЯ БАЗА: ${globalMemory || 'пусто'}
СТАРЫЙ ПРОГРЕСС: ${langMemory || 'пусто'}
Объедини старые факты с новыми и вызови saveStudentProfile. Голосом ничего не произноси!]`;
        socket.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [{ text: memoryPrompt }] }], turnComplete: true } }));
        setTimeout(() => finalizeStop(), 6000); 
      } else {
        finalizeStop();
      }
    }

    function finalizeStop() {
      stopBotSpeech();
      isSessionActive = false;
      isSetupComplete = false;
      isExtractingMemory = false;
      isWaitingForResponse = false;

      btnAction.disabled = false; 
      btnAction.innerText = "Начать урок"; 
      btnAction.className = "btn-main btn-start";
      btnEndTurn.style.display = "none"; 
      statusText.innerText = "Урок и прогресс сохранены.";
      
      if (socket && socket.readyState === WebSocket.OPEN) {
          socket.onclose = null; 
          socket.close();
      }
      
      localStorage.setItem(`learned_${targetLanguage}`, 'true'); 
      updateUI();
    }

    function playPcmChunk(base64Audio) {
      if (!playbackContext) return;
      
      const raw = window.atob(base64Audio); 
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      
      const int16Array = new Int16Array(bytes.buffer); 
      const float32Array = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) float32Array[i] = int16Array[i] / 32768;
      
      const audioBuffer = playbackContext.createBuffer(1, float32Array.length, 24000); 
      audioBuffer.getChannelData(0).set(float32Array);
      
      const source = playbackContext.createBufferSource(); 
      source.buffer = audioBuffer; 
      source.connect(playbackContext.destination);
      
      const currentTime = playbackContext.currentTime;
      if (scheduledPlayTime < currentTime) {
          scheduledPlayTime = currentTime + 0.04; 
      }
      
      source.start(scheduledPlayTime); 
      scheduledPlayTime += audioBuffer.duration;
      
      activeAudioSources.push(source); 
      source.onended = () => { 
        activeAudioSources = activeAudioSources.filter(s => s !== source); 
      };
    }
  </script>
