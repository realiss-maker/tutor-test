<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Tutor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; 
                 connect-src 'self' wss://generativelanguage.googleapis.com blob:; 
                 img-src 'self' https://images.unsplash.com data:; 
                 media-src 'self' blob:;">
  <title>AI Language Tutor v3.12.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background: linear-gradient(rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.98)), 
                  url('https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1920&q=80') no-repeat center center; 
      background-size: cover; 
      color: #f8fafc; 
      display: flex; 
      justify-content: center;
      align-items: center;
      height: 100dvh; 
      min-height: 100vh; 
      overflow: hidden; 
      transition: background-image 0.5s ease;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header { 
      padding: calc(12px + env(safe-area-inset-top, 0px)) 20px 12px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: rgba(15, 23, 42, 0.8); 
      backdrop-filter: blur(14px); 
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
      flex-shrink: 0; 
      z-index: 10;
    }

    .header-left { display: flex; flex-direction: column; }
    .header-title { font-weight: 600; font-size: 1.05rem; }
    .profile-badge { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }

    .header-right { display: flex; align-items: center; gap: 10px; }
    .timer-badge { 
      font-size: 0.9rem; 
      font-weight: 700; 
      color: #38bdf8; 
      background: rgba(15, 23, 42, 0.6); 
      padding: 4px 10px; 
      border-radius: 8px; 
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: none;
    }
    .timer-warning { color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); animation: blink 1.2s infinite alternate; }
    @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.4; } }
    .btn-icon { background: none; border: none; color: #f8fafc; font-size: 1.4rem; cursor: pointer; padding: 4px; }
    
    main { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 16px 20px; 
      text-align: center; 
      overflow: hidden;
      position: relative;
    }

    .progress-pill {
      display: none;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .avatar-wrapper {
      position: relative;
      width: 190px;
      height: 190px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-halo {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(37, 99, 235, 0) 70%);
      transition: transform 0.12s ease-out, opacity 0.12s ease-out;
      transform: scale(1);
      opacity: 0.3;
      z-index: 1;
    }
    .avatar-card {
      position: relative;
      width: 165px;
      height: 165px;
      border-radius: 50%;
      background: #0f172a;
      border: 3px solid #38bdf8;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56, 189, 248, 0.3);
      overflow: hidden;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .avatar-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .avatar-card.speaking {
      border-color: #c084fc;
      animation: landmarkPulse 1.6s infinite alternate ease-in-out;
    }
    .avatar-card.speaking img { transform: scale(1.08); }
    @keyframes landmarkPulse {
      0% { transform: scale(1); box-shadow: 0 8px 30px rgba(0,0,0,0.7), 0 0 35px rgba(192, 132, 252, 0.5); }
      100% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(0,0,0,0.9), 0 0 60px rgba(192, 132, 252, 0.85); }
    }

    .status-text { 
      font-size: 1.05rem; 
      font-weight: 500; 
      color: #e2e8f0; 
      margin-top: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6); 
      min-height: 28px;
    }

    footer { 
      padding: 14px 20px calc(16px + env(safe-area-inset-bottom, 0px)) 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 10px; 
      background: rgba(15, 23, 42, 0.85); 
      backdrop-filter: blur(14px); 
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.1); 
      flex-shrink: 0; 
    }
    .btn-main { 
      width: 100%; 
      max-width: 340px; 
      padding: 15px; 
      border-radius: 14px; 
      border: none; 
      font-size: 1rem; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .btn-start { background: #2563eb; color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
    .btn-stop { background: #ef4444; color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
    .btn-turn { background: #0284c7; color: white; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    .btn-interrupt { background: #d97706; color: white; box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4); display: none; }
    .btn-main:active { transform: scale(0.97); }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); justify-content: center; align-items: center; padding: 20px; z-index: 50; }
    .modal-content { background: #1e293b; padding: 22px; border-radius: 16px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-content input, .modal-content select { padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 0.9rem; width: 100%; }
    .modal-content label { font-size: 0.82rem; color: #94a3b8; margin-bottom: -5px; text-align: left; }
    .modal-content button { padding: 11px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .btn-save { background: #2563eb; color: white; margin-top: 4px; }
    .btn-reset-current { background: #475569; color: #f8fafc; }
    .btn-reset-all { background: #991b1b; color: #fee2e2; }
    .btn-close { background: transparent; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-left">
        <div class="header-title" id="headerTitle">AI Tutor</div>
        <div class="profile-badge" id="profileBadge">Загрузка...</div>
      </div>

      <div class="header-right">
        <div class="timer-badge" id="timerBadge">15:00</div>
        <button class="btn-icon" id="btnSettings" title="Настройки">⚙</button>
      </div>
    </header>

    <main>
      <div class="progress-pill" id="progressPill">Блок 1 • Разминка и фразы 1–5</div>

      <div class="avatar-wrapper">
        <div class="avatar-halo" id="avatarHalo"></div>
        <div class="avatar-card" id="avatarCard">
          <img id="landmarkImage" src="" alt="Landmark">
        </div>
      </div>
      <div class="status-text" id="statusText">Нажмите «Начать урок» для старта</div>
    </main>

    <footer>
      <button class="btn-main btn-interrupt" id="btnInterrupt">Перебить / Хватит ✋</button>
      <button class="btn-main btn-turn" id="btnEndTurn" style="display: none;">Я всё сказал, жду ответ ➔</button>
      <button class="btn-main btn-start" id="btnAction">Начать урок</button>
    </footer>
  </div>

  <div class="modal" id="modalSettings">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
        <h3 style="margin: 0; text-align: left;">Настройки</h3>
        <span style="font-size: 0.8rem; font-weight: 700; color: #38bdf8; background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); padding: 2px 8px; border-radius: 6px;">v3.12.0</span>
      </div>
      
      <label>Google AI Studio API Key:</label>
      <input type="password" id="inputApiKey" placeholder="AIzaSy..." 
             autocomplete="off" spellcheck="false" autocapitalize="off">
      
      <label>Режим хранения ключа:</label>
      <select id="selectStorageMode">
        <option value="local">Сохранить на этом устройстве (localStorage)</option>
        <option value="session">Только на время сессии (sessionStorage)</option>
      </select>

      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label>Изучаемый язык:</label>
          <select id="selectLanguage">
            <option value="french">Французский</option>
            <option value="english">Английский</option>
            <option value="spanish">Испанский</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label>Голос репетитора:</label>
          <select id="selectTeacher">
            <option value="female">Женский</option>
            <option value="male">Мужской</option>
          </select>
        </div>
      </div>

      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label>Пол ученика (обращение):</label>
          <select id="selectStudentGender">
            <option value="auto">Автоопределение (по имени и речи)</option>
            <option value="male">Мужской («ты сказал, повторил»)</option>
            <option value="female">Женский («ты сказала, повторила»)</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label>Язык объяснений:</label>
          <select id="selectNativeLang">
            <option value="ru">Русский</option>
            <option value="uk">Українська</option>
            <option value="auto">Автоопределение</option>
          </select>
        </div>
      </div>

      <label>Аудио-режим:</label>
      <select id="selectAudioMode">
        <option value="auto">Автодетекция (Гарнитура / Динамик)</option>
        <option value="half">Полудуплекс (динамик без эха)</option>
        <option value="full">Свободный дуплекс (для наушников)</option>
      </select>

      <button class="btn-save" id="btnSaveKey">Сохранить настройки</button>
      <button class="btn-reset-current" id="btnResetCurrentLang">Сбросить память текущего языка</button>
      <button class="btn-reset-all" id="btnResetAllMemory">Сбросить всю память (все языки)</button>
      <button class="btn-close" id="btnCloseModal">Закрыть</button>
      <div style="font-size: 0.75rem; color: #64748b; text-align: center; margin-top: 4px;">AI Tutor v3.12.0 • Auto-Gender & Lifelong Memory Engine</div>
    </div>
  </div>

  <script>
    function getStoredApiKey() {
      return sessionStorage.getItem('gemini_api_key') || localStorage.getItem('gemini_api_key') || '';
    }
    let apiKey = getStoredApiKey();
    let storageMode = localStorage.getItem('api_storage_mode') || 'local';
    let teacherGender = localStorage.getItem('teacher_gender') || 'female';
    let studentGender = localStorage.getItem('student_gender') || 'auto';
    let targetLanguage = localStorage.getItem('target_language') || 'french';
    let nativeLang = localStorage.getItem('native_lang') || 'ru';
    let audioMode = localStorage.getItem('audio_mode') || 'auto';
    let globalMemory = localStorage.getItem('global_memory') || '';
    let langMemory = localStorage.getItem(`memory_${targetLanguage}`) || '';     

    const btnAction = document.getElementById('btnAction');
    const btnEndTurn = document.getElementById('btnEndTurn');
    const btnInterrupt = document.getElementById('btnInterrupt');
    const statusText = document.getElementById('statusText');
    const avatarCard = document.getElementById('avatarCard');
    const avatarHalo = document.getElementById('avatarHalo');
    const profileBadge = document.getElementById('profileBadge');
    const timerBadge = document.getElementById('timerBadge');
    const progressPill = document.getElementById('progressPill');
    const headerTitle = document.getElementById('headerTitle');
    const modalSettings = document.getElementById('modalSettings');
    const btnSettings = document.getElementById('btnSettings');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnSaveKey = document.getElementById('btnSaveKey');
    const btnResetCurrentLang = document.getElementById('btnResetCurrentLang');
    const btnResetAllMemory = document.getElementById('btnResetAllMemory');
    const inputApiKey = document.getElementById('inputApiKey');
    const selectStorageMode = document.getElementById('selectStorageMode');
    const selectTeacher = document.getElementById('selectTeacher');
    const selectStudentGender = document.getElementById('selectStudentGender');
    const selectLanguage = document.getElementById('selectLanguage');
    const selectNativeLang = document.getElementById('selectNativeLang');
    const selectAudioMode = document.getElementById('selectAudioMode');

    const landmarkPhotos = {
      french: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=600&q=80",
      spanish: "https://images.unsplash.com/photo-1539037116277-4db20889f2d4?auto=format&fit=crop&w=600&q=80",
      english: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=600&q=80"
    };

    const bgPhotos = {
      french: "https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1920&q=80",
      spanish: "https://images.unsplash.com/photo-1543783207-ec64e4d95325?auto=format&fit=crop&w=1920&q=80",
      english: "https://images.unsplash.com/photo-1526129318478-62ed807ebdf9?auto=format&fit=crop&w=1920&q=80"
    };

    function getTeacherName() {
      if (targetLanguage === 'french') return teacherGender === 'male' ? 'Лоран (Laurent)' : 'Камилла (Camille)';
      if (targetLanguage === 'english') return teacherGender === 'male' ? 'Артур (Arthur)' : 'Эмма (Emma)';
      if (targetLanguage === 'spanish') return teacherGender === 'male' ? 'Диего (Diego)' : 'Кармен (Carmen)';
    }

    function updateUI() {
      langMemory = localStorage.getItem(`memory_${targetLanguage}`) || '';
      globalMemory = localStorage.getItem('global_memory') || '';
      
      const hasLangProgress = langMemory && langMemory.trim() !== '' && langMemory !== 'Чистый лист.' && langMemory !== 'Чистий аркуш.' && langMemory !== 'Чистый лист (урок 1).';
      profileBadge.innerText = hasLangProgress ? "Профиль активен" : "Новый курс";
      
      let shortName = '', langLabel = '';
      if (targetLanguage === 'french') { shortName = teacherGender === 'male' ? 'Laurent' : 'Camille'; langLabel = 'Français'; }
      if (targetLanguage === 'english') { shortName = teacherGender === 'male' ? 'Arthur' : 'Emma'; langLabel = 'English'; }
      if (targetLanguage === 'spanish') { shortName = teacherGender === 'male' ? 'Diego' : 'Carmen'; langLabel = 'Español'; }
      headerTitle.innerText = `${shortName} • ${langLabel}`;

      const imgElem = document.getElementById('landmarkImage');
      if (imgElem && landmarkPhotos[targetLanguage]) {
        imgElem.src = landmarkPhotos[targetLanguage];
      }

      if (bgPhotos[targetLanguage]) {
        document.body.style.backgroundImage = `linear-gradient(rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.98)), url('${bgPhotos[targetLanguage]}')`;
      }
    }
    updateUI();

    btnSettings.onclick = () => { 
      inputApiKey.value = apiKey; 
      selectStorageMode.value = storageMode;
      selectTeacher.value = teacherGender;
      selectStudentGender.value = studentGender;
      selectLanguage.value = targetLanguage;
      selectNativeLang.value = nativeLang;
      selectAudioMode.value = audioMode;
      modalSettings.style.display = 'flex'; 
    };
    btnCloseModal.onclick = () => { modalSettings.style.display = 'none'; };

    btnSaveKey.onclick = () => {
      apiKey = inputApiKey.value.trim(); 
      storageMode = selectStorageMode.value;
      teacherGender = selectTeacher.value;
      studentGender = selectStudentGender.value;
      targetLanguage = selectLanguage.value;
      nativeLang = selectNativeLang.value;
      audioMode = selectAudioMode.value;

      localStorage.setItem('api_storage_mode', storageMode);
      if (storageMode === 'local') {
        localStorage.setItem('gemini_api_key', apiKey);
        sessionStorage.removeItem('gemini_api_key');
      } else {
        sessionStorage.setItem('gemini_api_key', apiKey);
        localStorage.removeItem('gemini_api_key');
      }

      localStorage.setItem('teacher_gender', teacherGender);
      localStorage.setItem('student_gender', studentGender);
      localStorage.setItem('target_language', targetLanguage);
      localStorage.setItem('native_lang', nativeLang);
      localStorage.setItem('audio_mode', audioMode);

      updateUI(); 
      modalSettings.style.display = 'none'; 
      alert('Настройки сохранены успешно.');
    };

    btnResetCurrentLang.onclick = () => {
      if (!confirm("Сбросить накопительную память и историю для текущего языка?")) return;
      localStorage.removeItem(`memory_${targetLanguage}`); 
      langMemory = '';
      updateUI(); 
      modalSettings.style.display = 'none'; 
      alert('Память текущего языка очищена.');
    };

    btnResetAllMemory.onclick = () => {
      if (!confirm("ВНИМАНИЕ: Удалить ВСЕ данные профиля и историю по всем языкам?")) return;
      localStorage.removeItem('memory_french'); 
      localStorage.removeItem('memory_english'); 
      localStorage.removeItem('memory_spanish'); 
      localStorage.removeItem('global_memory');
      globalMemory = ''; 
      langMemory = '';
      updateUI(); 
      modalSettings.style.display = 'none'; 
      alert('Вся память профиля полностью сброшена.');
    };

    // --- СИСТЕМНЫЙ ПРОМПТ С АВТООПРЕДЕЛЕНИЕМ ПОЛА И НАКОПИТЕЛЬНОЙ ПАМЯТЬЮ О ЖИЗНИ ---
    function getSystemInstruction() {
      const tName = getTeacherName();
      const tRole = teacherGender === 'male' ? 'эмпатичный и теплый преподаватель' : 'эмпатичная и теплая преподавательница';
      let langName = '', langAdverb = '';
      if (targetLanguage === 'french') { langName = 'французского'; langAdverb = 'по-французски'; }
      if (targetLanguage === 'english') { langName = 'английского'; langAdverb = 'по-английски'; }
      if (targetLanguage === 'spanish') { langName = 'испанского'; langAdverb = 'по-испански'; }

      let genderDirective = '';
      if (studentGender === 'male') {
        genderDirective = `ПОЛ УЧЕНИКА (ГРАММАТИЧЕСКИЙ РОД): Ученик — МУЖЧИНА (задано в настройках). Обращайся к нему СТРОГО в МУЖСКОМ роде («ты сказал», «ты повторил», «ты готов», «молодец, справился»). КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО обращаться в женском роде!`;
      } else if (studentGender === 'female') {
        genderDirective = `ПОЛ УЧЕНИКА (ГРАММАТИЧЕСКИЙ РОД): Ученик — ЖЕНЩИНА (задано в настройках). Обращайся к ней СТРОГО в ЖЕНСКОМ роде («ты сказала», «ты повторила», «ты готова», «молодец, справилась»).`;
      } else {
        genderDirective = `ПОЛ УЧЕНИКА (АВТООПРЕДЕЛЕНИЕ И СОГЛАСОВАНИЕ):
1. Если в блоке [ОБЩИЕ ДАННЫЕ О ЖИЗНИ] уже указан пол или имя ученика — строго следуй этому полу во всех репликах!
2. Если пол пока неизвестен (первый урок / чистый лист):
   - Определи пол ученика ЕСТЕСТВЕННЫМ ПУТЕМ: по его имени (например, Анна, Елена, Мария — женский род; Сергей, Алексей, Денис — мужской род) И/ИЛИ по окончаниям прошедшего времени и кратких форм в его ответах («я изучал / изучала», «я хотел / хотела», «готов / готова», «рад / рада»).
   - Как только пол определен — сразу и безошибочно согласуй все свои реплики с этим родом (для мужчин: «ты сказал, повторил, готов, справился»; для женщин: «ты сказала, повторила, готова, справилась»).
   - Обязательно зафиксируй установленный пол в памяти при сохранении профиля!`;
      }

      const originalPrompt = `Ты — ${tName}, ${tRole} ${langName} языка. Твой голос — ${teacherGender === 'male' ? 'приятный мужской' : 'мягкий женский'}.
Твоя главная черта — искреннее дружелюбие, теплота и естественность. Общайся как хороший друг, а не как строгий робот-учитель. Веди диалог плавно, реплика за репликой. НЕ задавай несколько вопросов подряд.

${genderDirective}

СЕКРЕТНАЯ ПАМЯТЬ ОБ УЧЕНИКЕ (НЕ ОЗВУЧИВАЙ ЭТО, ИСПОЛЬЗУЙ ДЛЯ ДИАЛОГА):

1. Назови конкретное слово или фразу, которую ученик произнес неправильно.

        constructor() {

          this.bufferSize = 1024;
          this.pcmBuffer = new Int16Array(this.bufferSize);
          this.bufferIndex = 0;
          this.phase = 0;

        process(inputs, outputs, parameters) {
          const input = inputs[0];
          if (input && input.length > 0) {
            const channelData = input[0];

            while (this.phase < channelData.length) {

              const s = Math.max(-1, Math.min(1, channelData[idx]));
              sum += s * s;

              if (this.bufferIndex >= this.bufferSize) {

        let promptText = nativeLang === 'uk' 
          ? `[СИСТЕМНО: Залишилося ще ${minutesLeft} хв. Урок триває. УВАГА: Оціни та проаналізуй мою репліку! ${genderHint} Якщо пояснюєш нову фразу — строго за правилом: 1) Зміст рідною мовою, 2) ДВІЧІ повільно іноземною мовою з тишею між ними, 3) Команда «Повтори» і мовчання! НЕ вимовляй слово «пауза»!]`
          : `[СИСТЕМНО: Осталось еще ${minutesLeft} мин. Урок идет. ВНИМАНИЕ: Оцени и проанализируй мою реплику! ${genderHint} Если даешь новую фразу — строго по правилу: 1) Смысл на родном языке, 2) ДВАЖДЫ медленно на изучаемом языке с тишиной между ними, 3) Команда «Повтори» и молчание! НЕ произноси слово «пауза»!]`;
          
        if (isTimeWarningPending) {
          promptText += nativeLang === 'uk'
            ? " [СИСТЕМНА ПІДКАЗКА: ЧАС УРОКУ ДОБІГАЄ КІНЦЯ (менше 2 хв). Проведи фінальну двосторонню перевірку 2 слів, підведи підсумки, узгодь тему на наступний урок і тепло попрощайся без обривів!]"
            : " [СИСТЕМНАЯ ПОДСКАЗКА: ВРЕМЯ УРОКА ВЫХОДИТ (меньше 2 мин). Проведи финальную двустороннюю проверку 2 слов, подведи итоги, согласуй тему на следующий урок и тепло попрощайся без обрывов!]";
          isTimeWarningPending = false;
        }

        socket.send(JSON.stringify({ 
          clientContent: { turns: [{ role: "user", parts: [{ text: promptText }] }], turnComplete: true } 
        }));

        clearTimeout(watchdogTimer);
        watchdogTimer = setTimeout(() => {
          if (isWaitingForResponse) {
            isWaitingForResponse = false;
            statusText.innerText = "Слушаю вас...";
          }
        }, 4500);
      }
    };

    btnInterrupt.onclick = () => {
      if (isBotSpeaking) {
        stopBotSpeech();
        isWaitingForResponse = false;
        statusText.innerText = "Слушаю вас...";
      }
    };

    function stopBotSpeech() {
      activeAudioSources.forEach(source => { try { source.stop(); } catch(e) {} });
      activeAudioSources = []; 
      isBotSpeaking = false; 
      scheduledPlayTime = 0; 
      avatarCard.classList.remove('speaking');
      btnInterrupt.style.display = "none";
    }

    function startLessonTimer() {
      lessonSecondsRemaining = 15 * 60;
      isTimeWarningPending = false;
      timerBadge.style.display = "block";
      progressPill.style.display = "inline-block";
      timerBadge.classList.remove('timer-warning');
      updateTimerBadge();

      clearInterval(lessonTimerInterval);
      lessonTimerInterval = setInterval(() => {
        lessonSecondsRemaining--;
        updateTimerBadge();

        if (lessonSecondsRemaining > 10 * 60) {
          progressPill.innerText = "Блок 1 • Разминка и фразы 1–5";
        } else if (lessonSecondsRemaining > 5 * 60) {
          progressPill.innerText = "Блок 2 • Практика и фразы 6–10";
        } else {
          progressPill.innerText = "Блок 3 • Закрепление и фразы 11–15";
        }

        if (lessonSecondsRemaining === 120) {
          timerBadge.classList.add('timer-warning');
          isTimeWarningPending = true;
        }

        if (lessonSecondsRemaining <= 0) {
          clearInterval(lessonTimerInterval);
          statusText.innerText = "Время урока истекло. Завершение...";
          stopSession(false);
        }
      }, 1000);
    }

    function stopLessonTimer() {
      clearInterval(lessonTimerInterval);
      timerBadge.style.display = "none";
      progressPill.style.display = "none";
      isTimeWarningPending = false;
    }

    function updateTimerBadge() {
      const m = Math.floor(lessonSecondsRemaining / 60);
      const s = lessonSecondsRemaining % 60;
      timerBadge.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    async function startSession() {
      apiKey = getStoredApiKey();
      if (!apiKey) { 
        modalSettings.style.display = 'flex'; 
        return; 
      }
      
      if (!playbackContext) playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      if (playbackContext.state === 'suspended') await playbackContext.resume();

      btnAction.disabled = true; 
      isSessionActive = true;
      isSetupComplete = false;
      isExtractingMemory = false;
      isWaitingForResponse = false;
      memorySavedSuccessfully = false;
      stopBotSpeech();

      if (!mediaStream) await initMicrophone();
      if (audioContext && audioContext.state === 'suspended') await audioContext.resume();

      await requestWakeLock();
      connectWebSocket();
    }

    function connectWebSocket() {
      statusText.innerText = "Соединение с сервером...";
      socket = new WebSocket(`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`);
      
      socket.onopen = () => {
        const setupMessage = {
          setup: {
            model: "models/gemini-2.5-flash-native-audio-latest",
            generationConfig: { 
              responseModalities: ["AUDIO"], 
              speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: teacherGender === 'male' ? "Puck" : "Aoede" } } } 
            },
            systemInstruction: { parts: [{ text: getSystemInstruction() }] },
            tools: [{ 
              functionDeclarations: [{ 
                name: "saveStudentProfile", 
                description: "Сохранить профиль ученика в постоянную накопительную память. ВНИМАНИЕ: Вызывать ТОЛЬКО по системной команде завершения урока в самом конце! Во время урока вызов СТРОГО ЗАПРЕЩЕН.", 
                parameters: { 
                  type: "OBJECT", 
                  properties: { 
                    global_memory: { type: "STRING", description: "Накопительный профиль: Имя, Пол (грамматический род), профессия, семья, питомец, город, хобби, привычки." }, 
                    lang_memory: { type: "STRING", description: "Накопительный архив языка: [ЖУРНАЛ УРОКОВ], [НАКОПИТЕЛЬНЫЙ СЛОВАРЬ], [БАНК ОШИБОК И ЗАКРЕПЛЕНИЯ], [ПЛАН НА СЛЕДУЮЩИЙ УРОК]." } 
                  }, 
                  required: ["global_memory", "lang_memory"] 
                } 
              }] 
            }]
          }
        };
        socket.send(JSON.stringify(setupMessage));
      };

      socket.onmessage = async (event) => {
        const responseData = event.data instanceof Blob ? JSON.parse(await event.data.text()) : JSON.parse(event.data);
        
        if (responseData.setupComplete) {
           isSetupComplete = true;
           btnAction.disabled = false; 
           btnAction.innerText = "Завершить урок"; 
           btnAction.className = "btn-main btn-stop";
           btnEndTurn.style.display = "block"; 
           statusText.innerText = "Слушаю вас...";
           startLessonTimer();

           let helloWord = targetLanguage === 'french' ? 'Bonjour' : (targetLanguage === 'english' ? 'Hello' : '¡Hola');
           const hasCurrentLangMemory = langMemory && langMemory.trim() !== '' && langMemory !== 'Чистый лист.' && langMemory !== 'Чистий аркуш.' && langMemory !== 'Чистый лист (урок 1).';

           let startPrompt = '';
           if (nativeLang === 'ru') {
             startPrompt = !hasCurrentLangMemory 
               ? `${helloWord}! [ИНСТРУКЦИЯ К УРОКУ 1: Поздоровайся на изучаемом языке. Спроси на изучаемом языке имя ученика и спроси, изучал(а) ли он(а) этот язык раньше. СРАЗУ ЗАМОЛКНИ, жди ответа!]`
               : `${helloWord}! [ИНСТРУКЦИЯ К ХОДУ 1: Радостно поздоровайся по имени. Задай ТОЛЬКО ОДИН вопрос о делах или настроении на изучаемом языке БЕЗ перевода. КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО в этой реплике проверять слова или объявлять темы! Задай вопрос о делах и СРАЗУ ЗАМОЛКНИ, жди ответа ученика!]`;
           } else if (nativeLang === 'uk') {
             startPrompt = !hasCurrentLangMemory 
               ? `${helloWord}! [ІНСТРУКЦІЯ ДО УРОКУ 1: Привітайся мовою вивчення. Запитай мовою вивчення ім'я учня і поцікався, чи вивчав(ла) він/вона цю мову раніше. ВІДРАЗУ ЗАМОВКНИ, чекай відповіді!]`
               : `${helloWord}! [ІНСТРУКЦІЯ ДО ХОДУ 1: Привітайся на ім'я. Задай ЛИШЕ ОДНЕ питання про справи або настрій мовою вивчення БЕЗ перекладу. КАТЕГОРИЧНО ЗАБОРОНЕНО у цій репліці перевіряти слова або оголошувати теми! Задай питання про справи і ВІДРАЗУ ЗАМОВКНИ, чекай відповіді учня!]`;
           } else {
             startPrompt = `${helloWord}! [ИНСТРУКЦИЯ: Поздоровайся и начни первый шаг. СРАЗУ ЗАМОЛКНИ!]`;
           }
           
           socket.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [{ text: startPrompt }] }], turnComplete: true } }));
           return;
        }

        const functionCalls = responseData.toolCall?.functionCalls || 
          (responseData.serverContent?.modelTurn?.parts ? responseData.serverContent.modelTurn.parts.filter(p => p.functionCall).map(p => p.functionCall) : null);
        
        if (functionCalls && functionCalls.length > 0) {
          functionCalls.forEach(call => {
            if (call.name === "saveStudentProfile" && call.args) {
              if (call.args.global_memory) { 
                globalMemory = call.args.global_memory; 
                localStorage.setItem('global_memory', globalMemory); 
              }
              if (call.args.lang_memory) { 
                langMemory = call.args.lang_memory; 
                localStorage.setItem(`memory_${targetLanguage}`, langMemory); 
              }
              memorySavedSuccessfully = true;

              if (socket && socket.readyState === WebSocket.OPEN && call.id) {
                socket.send(JSON.stringify({
                  toolResponse: {
                    functionResponses: [{
                      response: { output: { status: "success" } },
                      id: call.id
                    }]
                  }
                }));
              }
            }
          });

          if (isExtractingMemory && memorySavedSuccessfully) {
            clearTimeout(stopSessionTimeoutId);
            setTimeout(() => finalizeStop("Урок и накопительный прогресс сохранены."), 300);
            return;
          }
        }

        if (isExtractingMemory && responseData.serverContent?.turnComplete) {
          if (memorySavedSuccessfully) {
            clearTimeout(stopSessionTimeoutId);
            setTimeout(() => finalizeStop("Урок и накопительный прогресс сохранены."), 300);
            return;
          }
        }

        if (responseData.serverContent?.interrupted) {
          clearTimeout(watchdogTimer);
          stopBotSpeech();
          isWaitingForResponse = false;
          statusText.innerText = "Слушаю вас...";
        }

        if (responseData.serverContent?.modelTurn) {
          clearTimeout(watchdogTimer);
          isWaitingForResponse = false;
          for (const part of responseData.serverContent.modelTurn.parts) {
            if (part.inlineData?.mimeType.startsWith("audio/pcm")) {
              playPcmChunk(part.inlineData.data); 
              if (!isBotSpeaking) {
                 isBotSpeaking = true; 
                 avatarCard.classList.add('speaking');
                 btnInterrupt.style.display = "block";
                 statusText.innerText = "Репетитор говорит...";
              }
            }
          }
        }
        
        if (responseData.serverContent?.turnComplete) { 
          clearTimeout(watchdogTimer);
          if (activeAudioSources.length === 0) {
            isBotSpeaking = false;
            avatarCard.classList.remove('speaking');
            btnInterrupt.style.display = "none";
            if (!isWaitingForResponse && isSessionActive) {
              statusText.innerText = "Ваша очередь говорить..."; 
            }
          }
        }
      };

      socket.onerror = (e) => { 
        console.warn("WebSocket error:", e);
        if (isSessionActive) {
          finalizeStop("Ошибка соединения с сервером.");
        }
      };
      
      socket.onclose = (e) => { 
        console.warn("WebSocket close code:", e.code, e.reason);
        if (isSessionActive) {
          const msg = lessonSecondsRemaining <= 10 ? "Урок и накопительный прогресс сохранены." : "Связь с сервером завершена. Данные сохранены.";
          finalizeStop(msg);
        }
      };
    }

    function stopSession(forceImmediate = false) {
      if (!isSessionActive) return;
      isExtractingMemory = true;
      stopLessonTimer();
      btnAction.disabled = true; 
      btnEndTurn.style.display = "none";
      btnInterrupt.style.display = "none";

      const proceedToSave = () => {
        statusText.innerText = "Сохранение накопительной памяти...";
        if (socket && socket.readyState === WebSocket.OPEN && isSetupComplete) {
          const langDirective = nativeLang === 'ru' ? 'Записи сделай на РУССКОМ языке.' : (nativeLang === 'uk' ? 'Записи зроби УКРАЇНСЬКОЮ мовою.' : '');
          const memoryPrompt = `[СИСТЕМНАЯ ДИРЕКТИВА: Урок завершен. Немедленно вызови функцию saveStudentProfile.
ВНИМАНИЕ: Твоя память — это ДВА НАКОПИТЕЛЬНЫХ АРХИВА (CUMULATIVE). КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО СТИРАТЬ или сокращать ранее сохраненные данные!
ОБЯЗАТЕЛЬНО ОБЪЕДИНИ старые данные с новыми:

1. global_memory (БАЗА ЖИЗНИ И ПРОФИЛЬ):
- Имя и установленный Пол ученика (грамматический род: мужской или женский).
- Все известные факты: профессия, семья, питомец, город, хобби, привычки.
- Если на сегодняшнем уроке стали известны НОВЫЕ факты — бережно добавь их, сохранив ВСЕ старые факты!

2. lang_memory (НАКОПИТЕЛЬНЫЙ АРХИВ ЯЗЫКА):
- [ЖУРНАЛ УРОКОВ]: список всех тем всех прошедших уроков (добавь сегодняшний урок с темой).
- [НАКОПИТЕЛЬНЫЙ СЛОВАРЬ]: полный список всех слов за все уроки (добавь сегодняшние новые слова).
- [БАНК ОШИБОК И ЗАКРЕПЛЕНИЯ]: слова/фразы/звуки, в которых ученик ошибся + неисправленные старые ошибки.
- [СОГЛАСОВАННАЯ ТЕМА СЛЕДУЮЩЕГО УРОКА]: тема, которую договорились разобрать в следующий раз.

${langDirective}
СТАРАЯ БАЗА О ЖИЗНИ: ${globalMemory || 'пусто'}
СТАРАЯ НАКОПИТЕЛЬНАЯ ПАМЯТЬ ЯЗЫКА: ${langMemory || 'пусто'}
Вызови saveStudentProfile с полными объединенными данными. Голосом ничего не говори!]`;
          
          socket.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [{ text: memoryPrompt }] }], turnComplete: true } }));
          
          clearTimeout(stopSessionTimeoutId);
          stopSessionTimeoutId = setTimeout(() => {
            finalizeStop("Урок и накопительный прогресс сохранены.");
          }, 6500);
        } else {
          finalizeStop("Урок завершен.");
        }
      };

      if (!forceImmediate && (activeAudioSources.length > 0 || isBotSpeaking)) {
        statusText.innerText = "Репетитор договаривает...";
        const waitAudio = setInterval(() => {
          if (activeAudioSources.length === 0 && !isBotSpeaking) {
            clearInterval(waitAudio);
            proceedToSave();
          }
        }, 150);
        setTimeout(() => {
          clearInterval(waitAudio);
          proceedToSave();
        }, 5000);
      } else {
        stopBotSpeech();
        proceedToSave();
      }
    }

    function finalizeStop(finalMessage = "Урок и накопительный прогресс сохранены.") {
      clearTimeout(stopSessionTimeoutId);
      stopSessionTimeoutId = null;
      stopLessonTimer();
      releaseWakeLock();

      const completeCleanup = () => {
        stopBotSpeech();
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
          mediaStream = null;
        }
        if (sourceNode) {
          try { sourceNode.disconnect(); } catch(e) {}
          sourceNode = null;
        }
        if (biquadFilter) {
          try { biquadFilter.disconnect(); } catch(e) {}
          biquadFilter = null;
        }
        if (audioContext && audioContext.state === 'running') {
          try { audioContext.suspend(); } catch(e) {}
        }
        if (playbackContext && playbackContext.state === 'running') {
          try { playbackContext.suspend(); } catch(e) {}
        }

        isSessionActive = false;
        isSetupComplete = false;
        isExtractingMemory = false;
        isWaitingForResponse = false;

        btnAction.disabled = false; 
        btnAction.innerText = "Начать урок"; 
        btnAction.className = "btn-main btn-start";
        btnEndTurn.style.display = "none"; 
        btnInterrupt.style.display = "none";
        statusText.innerText = finalMessage;
        
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.onclose = null; 
          socket.close();
        }
        updateUI();
      };

      if (activeAudioSources.length > 0) {
        statusText.innerText = "Завершение реплики...";
        const drainCheckInterval = setInterval(() => {
          if (activeAudioSources.length === 0) {
            clearInterval(drainCheckInterval);
            completeCleanup();
          }
        }, 150);
        setTimeout(() => {
          clearInterval(drainCheckInterval);
          completeCleanup();
        }, 3500);
      } else {
        completeCleanup();
      }
    }

    function playPcmChunk(base64Audio) {
      if (!playbackContext) return;
      
      const raw = window.atob(base64Audio); 
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      
      const sampleCount = Math.floor(raw.length / 2);
      const int16Array = new Int16Array(bytes.buffer, 0, sampleCount); 
      const float32Array = new Float32Array(sampleCount);
      for (let i = 0; i < sampleCount; i++) float32Array[i] = int16Array[i] / 32768;
      
      const audioBuffer = playbackContext.createBuffer(1, float32Array.length, 24000); 
      audioBuffer.getChannelData(0).set(float32Array);
      
      const source = playbackContext.createBufferSource(); 
      source.buffer = audioBuffer; 
      source.connect(playbackContext.destination);
      
      const currentTime = playbackContext.currentTime;
      if (scheduledPlayTime < currentTime) {
        scheduledPlayTime = currentTime + 0.05; 
      }
      
      source.start(scheduledPlayTime); 
      scheduledPlayTime += audioBuffer.duration;
      
      activeAudioSources.push(source); 
      source.onended = () => { 
        activeAudioSources = activeAudioSources.filter(s => s !== source); 
        if (activeAudioSources.length === 0) {
          setTimeout(() => {
            if (activeAudioSources.length === 0 && isSessionActive) {
              isBotSpeaking = false;
              avatarCard.classList.remove('speaking');
              btnInterrupt.style.display = "none";
              if (!isWaitingForResponse) {
                statusText.innerText = "Ваша очередь говорить...";
              }
            }
          }, 200);
        }
      };
    }
  </script>
