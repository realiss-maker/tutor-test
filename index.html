<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- PWA & Mobile Web App метатеги для iOS Safari, Android Chrome и ПК -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Tutor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Защита CSP: блокировка посторонних сетевых утечек API-ключа -->
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; 
                 connect-src 'self' wss://generativelanguage.googleapis.com blob:; 
                 img-src 'self' https://images.unsplash.com data:; 
                 media-src 'self' blob:;">
  <title>AI Language Tutor v3.6.1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background: linear-gradient(rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.98)), 
                  url('https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1920&q=80') no-repeat center center; 
      background-size: cover; 
      color: #f8fafc; 
      display: flex; 
      justify-content: center;
      align-items: center;
      height: 100dvh; 
      min-height: 100vh; 
      overflow: hidden; 
      transition: background-image 0.5s ease;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header { 
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: rgba(15, 23, 42, 0.8); 
      backdrop-filter: blur(14px); 
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
      flex-shrink: 0; 
      z-index: 10;
    }

    .header-left { display: flex; flex-direction: column; }
    .header-title { font-weight: 600; font-size: 0.95rem; }
    .profile-badge { font-size: 0.75rem; color: #94a3b8; margin-top: 1px; }

    /* Переключатель закладок (Урок / Текст) */
    .nav-tabs {
      display: flex;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .tab-btn {
      padding: 5px 12px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    .header-right { display: flex; align-items: center; gap: 8px; }
    .timer-badge { 
      font-size: 0.85rem; 
      font-weight: 700; 
      color: #38bdf8; 
      background: rgba(15, 23, 42, 0.6); 
      padding: 4px 8px; 
      border-radius: 8px; 
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: none;
    }
    .timer-warning { color: #f59e0b; border-color: rgba(245, 158, 11, 0.4); animation: blink 1.2s infinite alternate; }
    @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.4; } }
    .btn-icon { background: none; border: none; color: #f8fafc; font-size: 1.3rem; cursor: pointer; padding: 2px 4px; }
    
    main { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 12px 16px; 
      text-align: center; 
      overflow: hidden;
      position: relative;
    }

    /* Экран 1: Классический чистый визуальный вид (Урок) */
    .view-lesson {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .avatar-wrapper {
      position: relative;
      width: 190px;
      height: 190px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-halo {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(37, 99, 235, 0) 70%);
      transition: transform 0.15s ease-out, opacity 0.15s ease-out;
      transform: scale(1);
      opacity: 0.3;
      z-index: 1;
    }
    .avatar-card {
      position: relative;
      width: 165px;
      height: 165px;
      border-radius: 50%;
      background: #0f172a;
      border: 3px solid #38bdf8;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(56, 189, 248, 0.3);
      overflow: hidden;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .avatar-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .avatar-card.speaking {
      border-color: #c084fc;
      animation: landmarkPulse 1.6s infinite alternate ease-in-out;
    }
    .avatar-card.speaking img { transform: scale(1.08); }
    @keyframes landmarkPulse {
      0% { transform: scale(1); box-shadow: 0 8px 30px rgba(0,0,0,0.7), 0 0 35px rgba(192, 132, 252, 0.5); }
      100% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(0,0,0,0.9), 0 0 60px rgba(192, 132, 252, 0.85); }
    }

    .status-text { 
      font-size: 1.05rem; 
      font-weight: 500; 
      color: #e2e8f0; 
      margin-top: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6); 
      min-height: 28px;
    }

    /* Экран 2: Закладка живого текста диалога */
    .view-transcript {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      justify-content: flex-start;
      gap: 10px;
      padding: 8px 4px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .view-transcript::-webkit-scrollbar { width: 5px; }
    .view-transcript::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    .transcript-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.88rem;
      line-height: 1.45;
      text-align: left;
      max-width: 92%;
      word-break: break-word;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .bubble-tutor {
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #f8fafc;
      align-self: flex-start;
    }
    .bubble-user {
      background: rgba(37, 99, 235, 0.35);
      border: 1px solid rgba(37, 99, 235, 0.5);
      color: #e0f2fe;
      align-self: flex-end;
    }
    .bubble-system {
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed rgba(148, 163, 184, 0.3);
      color: #94a3b8;
      font-size: 0.8rem;
      align-self: center;
      text-align: center;
      max-width: 96%;
    }
    .bubble-author {
      font-weight: 700;
      font-size: 0.72rem;
      margin-bottom: 3px;
      color: #38bdf8;
    }
    .bubble-author.user { color: #60a5fa; }

    footer { 
      padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)) 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 10px; 
      background: rgba(15, 23, 42, 0.85); 
      backdrop-filter: blur(14px); 
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.1); 
      flex-shrink: 0; 
    }
    .btn-main { 
      width: 100%; 
      max-width: 340px; 
      padding: 14px; 
      border-radius: 14px; 
      border: none; 
      font-size: 0.95rem; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .btn-start { background: #2563eb; color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
    .btn-stop { background: #ef4444; color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
    .btn-turn { background: #0284c7; color: white; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    .btn-interrupt { background: #d97706; color: white; box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4); display: none; }
    .btn-main:active { transform: scale(0.97); }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); justify-content: center; align-items: center; padding: 20px; z-index: 50; }
    .modal-content { background: #1e293b; padding: 22px; border-radius: 16px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-content input, .modal-content select { padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 0.9rem; width: 100%; }
    .modal-content label { font-size: 0.82rem; color: #94a3b8; margin-bottom: -5px; text-align: left; }
    .modal-content button { padding: 11px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .btn-save { background: #2563eb; color: white; margin-top: 4px; }
    .btn-reset-current { background: #475569; color: #f8fafc; }
    .btn-reset-all { background: #991b1b; color: #fee2e2; }
    .btn-close { background: transparent; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-left">
        <div class="header-title" id="headerTitle">AI Tutor</div>
        <div class="profile-badge" id="profileBadge">Завантаження...</div>
      </div>
      
      <!-- Вкладки "Урок" и "Текст" -->
      <div class="nav-tabs">
        <button class="tab-btn active" id="tabLesson">🎧 Урок</button>
        <button class="tab-btn" id="tabTranscript">📜 Текст</button>
      </div>

      <div class="header-right">
        <div class="timer-badge" id="timerBadge">15:00</div>
        <button class="btn-icon" id="btnSettings" title="Налаштування">⚙️️</button>
      </div>
    </header>

    <main>
      <!-- Вкладка 1: Визуальный экран (чистый вид с достопримечательностью) -->
      <div class="view-lesson" id="viewLesson">
        <div class="avatar-wrapper">
          <div class="avatar-halo" id="avatarHalo"></div>
          <div class="avatar-card" id="avatarCard">
            <img id="landmarkImage" src="" alt="Landmark">
          </div>
        </div>
        <div class="status-text" id="statusText">Натисніть «Почати урок» для старту</div>
      </div>

      <!-- Вкладка 2: Экран живого текста (синхронные субтитры и история) -->
      <div class="view-transcript" id="viewTranscript">
        <div class="transcript-bubble bubble-system">
          Тут буде з'являтися текст розмови з репетитором. Ви можете перемикатися сюди в будь-який момент уроку.
        </div>
      </div>
    </main>

    <footer>
      <button class="btn-main btn-interrupt" id="btnInterrupt">Перебити / Досить ✋</button>
      <button class="btn-main btn-turn" id="btnEndTurn" style="display: none;">Я все сказав, чекаю відповідь ➔</button>
      <button class="btn-main btn-start" id="btnAction">Почати урок</button>
    </footer>
  </div>

  <div class="modal" id="modalSettings">
    <div class="modal-content">
      <h3 style="margin-bottom: 2px; text-align: left;">Налаштування</h3>
      
      <label>Google AI Studio API Key:</label>
      <input type="password" id="inputApiKey" placeholder="AIzaSy..." 
             autocomplete="off" spellcheck="false" autocapitalize="off">
      
      <label>Режим зберігання ключа:</label>
      <select id="selectStorageMode">
        <option value="local">Зберегти на цьому пристрої (localStorage)</option>
        <option value="session">Лише на час сесії (sessionStorage)</option>
      </select>

      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label>Мова вивчення:</label>
          <select id="selectLanguage">
            <option value="french">Французька</option>
            <option value="english">Англійська</option>
            <option value="spanish">Іспанська</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label>Голос репетитора:</label>
          <select id="selectTeacher">
            <option value="female">Жіночий</option>
            <option value="male">Чоловічий</option>
          </select>
        </div>
      </div>

      <label>Аудіо-режим:</label>
      <select id="selectAudioMode">
        <option value="auto">Автодетекція (Гарнітура / Динамік)</option>
        <option value="half">Напівдуплекс (динамік без відлуння)</option>
        <option value="full">Вільний дуплекс (для навушників)</option>
      </select>

      <button class="btn-save" id="btnSaveKey">Зберегти налаштування</button>
      <button class="btn-reset-current" id="btnResetCurrentLang">Скинути пам'ять поточної мови</button>
      <button class="btn-reset-all" id="btnResetAllMemory">Скинути всю пам'ять (всі мови)</button>
      <button class="btn-close" id="btnCloseModal">Закрити</button>
    </div>
  </div>

  <script>
    // --- Управління ключем та сховищем (BYOK) ---
    function getStoredApiKey() {
      return sessionStorage.getItem('gemini_api_key') || localStorage.getItem('gemini_api_key') || '';
    }
    let apiKey = getStoredApiKey();
    let storageMode = localStorage.getItem('api_storage_mode') || 'local';
    let teacherGender = localStorage.getItem('teacher_gender') || 'female';
    let targetLanguage = localStorage.getItem('target_language') || 'french';
    let audioMode = localStorage.getItem('audio_mode') || 'auto';
    let globalMemory = localStorage.getItem('global_memory') || '';
    let langMemory = localStorage.getItem(`memory_${targetLanguage}`) || '';     

    const btnAction = document.getElementById('btnAction');
    const btnEndTurn = document.getElementById('btnEndTurn');
    const btnInterrupt = document.getElementById('btnInterrupt');
    const statusText = document.getElementById('statusText');
    const avatarCard = document.getElementById('avatarCard');
    const avatarHalo = document.getElementById('avatarHalo');
    const profileBadge = document.getElementById('profileBadge');
    const timerBadge = document.getElementById('timerBadge');
    const headerTitle = document.getElementById('headerTitle');
    const modalSettings = document.getElementById('modalSettings');
    const btnSettings = document.getElementById('btnSettings');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnSaveKey = document.getElementById('btnSaveKey');
    const btnResetCurrentLang = document.getElementById('btnResetCurrentLang');
    const btnResetAllMemory = document.getElementById('btnResetAllMemory');
    const inputApiKey = document.getElementById('inputApiKey');
    const selectStorageMode = document.getElementById('selectStorageMode');
    const selectTeacher = document.getElementById('selectTeacher');
    const selectLanguage = document.getElementById('selectLanguage');
    const selectAudioMode = document.getElementById('selectAudioMode');

    // Элементы вкладок
    const tabLesson = document.getElementById('tabLesson');
    const tabTranscript = document.getElementById('tabTranscript');
    const viewLesson = document.getElementById('viewLesson');
    const viewTranscript = document.getElementById('viewTranscript');

    // Переключение между чистым экраном и экраном с текстом
    tabLesson.onclick = () => {
      tabLesson.classList.add('active');
      tabTranscript.classList.remove('active');
      viewLesson.style.display = 'flex';
      viewTranscript.style.display = 'none';
    };

    tabTranscript.onclick = () => {
      tabTranscript.classList.add('active');
      tabLesson.classList.remove('active');
      viewLesson.style.display = 'none';
      viewTranscript.style.display = 'flex';
      viewTranscript.scrollTop = viewTranscript.scrollHeight;
    };

    let currentTutorBubble = null;

    function appendTranscript(role, text) {
      if (!text || !text.trim()) return;
      
      if (role === 'tutor') {
        if (!currentTutorBubble) {
          currentTutorBubble = document.createElement('div');
          currentTutorBubble.className = 'transcript-bubble bubble-tutor';
          const author = document.createElement('div');
          author.className = 'bubble-author';
          author.innerText = getTeacherName().split(' ')[0];
          currentTutorBubble.appendChild(author);
          
          const content = document.createElement('span');
          content.className = 'bubble-body';
          content.innerText = text;
          currentTutorBubble.appendChild(content);
          viewTranscript.appendChild(currentTutorBubble);
        } else {
          const content = currentTutorBubble.querySelector('.bubble-body');
          if (content) content.innerText += (content.innerText.endsWith(' ') ? '' : ' ') + text;
        }
      } else {
        currentTutorBubble = null;
        const bubble = document.createElement('div');
        bubble.className = role === 'user' ? 'transcript-bubble bubble-user' : 'transcript-bubble bubble-system';
        if (role === 'user') {
          const author = document.createElement('div');
          author.className = 'bubble-author user';
          author.innerText = 'Ви';
          bubble.appendChild(author);
        }
        const content = document.createElement('div');
        content.innerText = text;
        bubble.appendChild(content);
        viewTranscript.appendChild(bubble);
      }
      viewTranscript.scrollTop = viewTranscript.scrollHeight;
    }

    const landmarkPhotos = {
      french: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=600&q=80",
      spanish: "https://images.unsplash.com/photo-1539037116277-4db20889f2d4?auto=format&fit=crop&w=600&q=80",
      english: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=600&q=80"
    };

    const bgPhotos = {
      french: "https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1920&q=80",
      spanish: "https://images.unsplash.com/photo-1543783207-ec64e4d95325?auto=format&fit=crop&w=1920&q=80",
      english: "https://images.unsplash.com/photo-1526129318478-62ed807ebdf9?auto=format&fit=crop&w=1920&q=80"
    };

    function getTeacherName() {
      if (targetLanguage === 'french') return teacherGender === 'male' ? 'Лоран (Laurent)' : 'Камілла (Camille)';
      if (targetLanguage === 'english') return teacherGender === 'male' ? 'Артур (Arthur)' : 'Емма (Emma)';
      if (targetLanguage === 'spanish') return teacherGender === 'male' ? 'Дієго (Diego)' : 'Кармен (Carmen)';
    }

    function updateUI() {
      langMemory = localStorage.getItem(`memory_${targetLanguage}`) || '';
      globalMemory = localStorage.getItem('global_memory') || '';
      
      const hasLangProgress = langMemory && langMemory.trim() !== '' && langMemory !== 'Чистый лист.' && langMemory !== 'Чистий аркуш.';
      profileBadge.innerText = hasLangProgress ? "Профіль активний" : "Новий курс";
      
      let shortName = '', langLabel = '';
      if (targetLanguage === 'french') { shortName = teacherGender === 'male' ? 'Laurent' : 'Camille'; langLabel = 'Français'; }
      if (targetLanguage === 'english') { shortName = teacherGender === 'male' ? 'Arthur' : 'Emma'; langLabel = 'English'; }
      if (targetLanguage === 'spanish') { shortName = teacherGender === 'male' ? 'Diego' : 'Carmen'; langLabel = 'Español'; }
      headerTitle.innerText = `${shortName} • ${langLabel}`;

      const imgElem = document.getElementById('landmarkImage');
      if (imgElem && landmarkPhotos[targetLanguage]) {
        imgElem.src = landmarkPhotos[targetLanguage];
      }

      if (bgPhotos[targetLanguage]) {
        document.body.style.backgroundImage = `linear-gradient(rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.98)), url('${bgPhotos[targetLanguage]}')`;
      }
    }
    updateUI();

    btnSettings.onclick = () => { 
      inputApiKey.value = apiKey; 
      selectStorageMode.value = storageMode;
      selectTeacher.value = teacherGender; 
      selectLanguage.value = targetLanguage;
      selectAudioMode.value = audioMode;
      modalSettings.style.display = 'flex'; 
    };
    btnCloseModal.onclick = () => { modalSettings.style.display = 'none'; };

    btnSaveKey.onclick = () => {
      apiKey = inputApiKey.value.trim(); 
      storageMode = selectStorageMode.value;
      teacherGender = selectTeacher.value; 
      targetLanguage = selectLanguage.value;
      audioMode = selectAudioMode.value;

      localStorage.setItem('api_storage_mode', storageMode);
      if (storageMode === 'local') {
        localStorage.setItem('gemini_api_key', apiKey);
        sessionStorage.removeItem('gemini_api_key');
      } else {
        sessionStorage.setItem('gemini_api_key', apiKey);
        localStorage.removeItem('gemini_api_key');
      }

      localStorage.setItem('teacher_gender', teacherGender); 
      localStorage.setItem('target_language', targetLanguage);
      localStorage.setItem('audio_mode', audioMode);

      updateUI(); 
      modalSettings.style.display = 'none'; 
      alert('Налаштування збережено успішно.');
    };

    btnResetCurrentLang.onclick = () => {
      if (!confirm("Скинути пам'ять та історію для поточної обраної мови?")) return;
      localStorage.removeItem(`memory_${targetLanguage}`); 
      langMemory = '';
      updateUI(); 
      modalSettings.style.display = 'none'; 
      appendTranscript('system', 'Пам\'ять поточної мови очищено.');
      alert('Пам\'ять поточної мови очищено.');
    };

    btnResetAllMemory.onclick = () => {
      if (!confirm("УВАГА: Видалити ВСІ збережені дані профілю та історію за всіма мовами?")) return;
      localStorage.removeItem('memory_french'); 
      localStorage.removeItem('memory_english'); 
      localStorage.removeItem('memory_spanish'); 
      localStorage.removeItem('global_memory');
      globalMemory = ''; 
      langMemory = '';
      updateUI();

      // 2. ДОПОВНЕННЯ (АКТИВНА РОЛЬ ВЕДУЧОГО, ПАУЗА 3-5 СЕК, ОПИТУВАННЯ ТА КРАЇНОЗНАВСТВО)
      const additions = `

АКТИВНОЕ ПЕДАГОГИЧЕСКОЕ ЛИДЕРСТВО И НЕПРЕРЫВНОСТЬ УРОКА:

      return originalPrompt + additions;
    }

    // --- Швидке блокове кодування Base64 без навантаження на процесор ---
    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      const chunkSize = 0x8000;
      for (let i = 0; i < len; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunkSize, len)));
      }
      return window.btoa(binary);
    }

    // --- Звуковий тракт (Web Audio API) та мережа ---
    let socket = null;
    let audioContext = null;
    let mediaStream = null;
    let sourceNode = null;
    let biquadFilter = null;
    let audioWorkletNode = null;
    let playbackContext = null;
    let scheduledPlayTime = 0;
    
    let isSessionActive = false;
    let isSetupComplete = false; 
    let isBotSpeaking = false;
    let isExtractingMemory = false;
    let isWaitingForResponse = false;
    let memorySavedSuccessfully = false;
    let isTimeWarningPending = false;

    let watchdogTimer = null;
    let stopSessionTimeoutId = null;
    let lessonTimerInterval = null;
    let lessonSecondsRemaining = 15 * 60;
    let activeAudioSources = [];
    let isHeadsetConnected = false;

    const workletCode = `
      class PCMProcessor extends AudioWorkletProcessor {
        constructor() {
          super();
          this.targetSampleRate = 16000;
        }
        process(inputs, outputs, parameters) {
          const input = inputs[0];
          if (input && input.length > 0) {
            const channelData = input[0];
            const sampleRateRatio = sampleRate / this.targetSampleRate;
            const newLength = Math.floor(channelData.length / sampleRateRatio);
            const pcm16 = new Int16Array(newLength);
            
            let sum = 0;
            for (let i = 0; i < newLength; i++) {
              let originalIndex = Math.floor(i * sampleRateRatio);
              let s = Math.max(-1, Math.min(1, channelData[originalIndex]));
              pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
              sum += s * s;
            }
            let rms = Math.sqrt(sum / (newLength || 1));
            this.port.postMessage({ pcm: pcm16.buffer, rms: rms }, [pcm16.buffer]);
          }
          return true;
        }
      }
      registerProcessor('pcm-processor', PCMProcessor);
    `;

    async function checkAudioOutputs() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
        const devices = await navigator.mediaDevices.enumerateDevices();
        isHeadsetConnected = devices.some(d => {
          const lbl = (d.label || '').toLowerCase();
          return lbl.includes('head') || lbl.includes('airpods') || lbl.includes('bluetooth') || lbl.includes('buds') || lbl.includes('ear');
        });
      } catch(e) {}
    }

    if (navigator.mediaDevices) {
      navigator.mediaDevices.ondevicechange = checkAudioOutputs;
    }

    async function initMicrophone() {
      if (!audioContext || audioContext.state === 'closed') {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      mediaStream = await navigator.mediaDevices.getUserMedia({ 
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
      });
      
      await checkAudioOutputs();

      if (!audioWorkletNode) {
        const blob = new Blob([workletCode], { type: 'application/javascript' });
        const workletUrl = URL.createObjectURL(blob);
        await audioContext.audioWorklet.addModule(workletUrl);
        audioWorkletNode = new AudioWorkletNode(audioContext, 'pcm-processor');
        
        audioWorkletNode.port.onmessage = (event) => {
          if (!isSessionActive || !isSetupComplete || !socket || socket.readyState !== WebSocket.OPEN) return;
          
          const rms = event.data.rms;
          
          if (!isBotSpeaking && !isWaitingForResponse) {
            if (rms > 0.015) { 
              avatarHalo.style.transform = `scale(${1 + Math.min(rms * 3, 0.45)})`; 
              avatarHalo.style.opacity = '1'; 
            } else { 
              avatarHalo.style.transform = "scale(1)"; 
              avatarHalo.style.opacity = '0.3'; 
            }
          }

          let allowTransmission = true;
          const currentMode = (audioMode === 'auto') ? (isHeadsetConnected ? 'full' : 'half') : audioMode;

          if (currentMode === 'half') {
            if (isBotSpeaking || isWaitingForResponse || isExtractingMemory) {
              allowTransmission = false;
            }
          } else {
            if (isExtractingMemory) allowTransmission = false;
          }

          if (allowTransmission) {
            const base64Data = arrayBufferToBase64(event.data.pcm);
            socket.send(JSON.stringify({ 
              realtimeInput: { 
                mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Data }] 
              } 
            }));
          }
        };
      }
      
      sourceNode = audioContext.createMediaStreamSource(mediaStream);
      biquadFilter = audioContext.createBiquadFilter();
      biquadFilter.type = "lowpass";
      biquadFilter.frequency.value = 7500;
      biquadFilter.Q.value = 0.707;

      sourceNode.connect(biquadFilter);
      biquadFilter.connect(audioWorkletNode);
    }

    // --- Кнопки управління уроком ---
    btnAction.onclick = () => { isSessionActive ? stopSession() : startSession(); };

          isTimeWarningPending = false;
        }

        socket.send(JSON.stringify({ 
          clientContent: { turns: [{ role: "user", parts: [{ text: promptText }] }], turnComplete: true } 
        }));

        clearTimeout(watchdogTimer);

          if (isWaitingForResponse) {

            statusText.innerText = "Слухаю вас...";

        }, 4000);

    btnInterrupt.onclick = () => {

    function stopBotSpeech() {
      activeAudioSources.forEach(source => { try { source.stop(); } catch(e) {} });
      activeAudioSources = [];

      scheduledPlayTime = 0; 
      avatarCard.classList.remove('speaking');

    function startLessonTimer() {
      lessonSecondsRemaining = 15 * 60;
      isTimeWarningPending = false;
      timerBadge.style.display = "block";
      timerBadge.classList.remove('timer-warning');
      updateTimerBadge();

      clearInterval(lessonTimerInterval);
      lessonTimerInterval = setInterval(() => {
        lessonSecondsRemaining--;
        updateTimerBadge();

        if (lessonSecondsRemaining === 120) {
          timerBadge.classList.add('timer-warning');
          isTimeWarningPending = true;
        }

        if (lessonSecondsRemaining <= 0) {
          clearInterval(lessonTimerInterval);
          statusText.innerText = "Час уроку вичерпано. Збереження...";
          stopSession();
        }
      }, 1000);
    }

    function stopLessonTimer() {
      clearInterval(lessonTimerInterval);
      timerBadge.style.display = "none";
      isTimeWarningPending = false;
    }

    function updateTimerBadge() {
      const m = Math.floor(lessonSecondsRemaining / 60);
      const s = lessonSecondsRemaining % 60;
      timerBadge.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // --- Запуск та підключення сесії ---
    async function startSession() {
      apiKey = getStoredApiKey();
      if (!apiKey) { 
        modalSettings.style.display = 'flex'; 
        return; 
      }
      
      // Розблокування Web Audio без знищення контексту (iOS Safari безпечно)
      if (!playbackContext) playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      if (playbackContext.state === 'suspended') await playbackContext.resume();

      btnAction.disabled = true; 
      isSessionActive = true;
      isSetupComplete = false;
      isExtractingMemory = false;
      isWaitingForResponse = false;
      memorySavedSuccessfully = false;
      currentTutorBubble = null;
      stopBotSpeech();

      if (!mediaStream) await initMicrophone();
      if (audioContext && audioContext.state === 'suspended') await audioContext.resume();

      connectWebSocket();
    }

    function connectWebSocket() {
      statusText.innerText = "З'єднання з сервером...";
      appendTranscript('system', 'Підключення до Gemini Live API...');
      socket = new WebSocket(`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`);
      
      socket.onopen = () => {
        const setupMessage = {
          setup: {
            model: "models/gemini-2.5-flash-native-audio-latest",
            generationConfig: { 
              responseModalities: ["AUDIO"], 
              speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: teacherGender === 'male' ? "Puck" : "Aoede" } } } 
            },
            // Запит на синхронну текстову транскрипцію аудіо
            outputAudioTranscription: {},
            systemInstruction: { parts: [{ text: getSystemInstruction() }] },
            tools: [{ 
              functionDeclarations: [{ 
                name: "saveStudentProfile", 
                description: "Зберегти профіль учня та його прогрес у пам'ять пристрою.", 
                parameters: { 
                  type: "OBJECT", 
                  properties: { 
                    global_memory: { type: "STRING", description: "Факти про учня (ім'я, сім'я, професія, місто, хобі тощо)." }, 
                    lang_memory: { type: "STRING", description: "Прогрес: розібрані теми, помилки, нові слова, вподобання." } 
                  }, 
                  required: ["global_memory", "lang_memory"] 
                } 
              }] 
            }]
          }
        };
        socket.send(JSON.stringify(setupMessage));
      };

      socket.onmessage = async (event) => {
        const responseData = event.data instanceof Blob ? JSON.parse(await event.data.text()) : JSON.parse(event.data);
        
        if (responseData.setupComplete) {
           isSetupComplete = true;
           btnAction.disabled = false; 
           btnAction.innerText = "Завершити урок"; 
           btnAction.className = "btn-main btn-stop";
           btnEndTurn.style.display = "block"; 
           statusText.innerText = "Слухаю вас...";
           appendTranscript('system', 'Зв\'язок встановлено. Урок розпочато.');
           startLessonTimer();

           let helloWord = targetLanguage === 'french' ? 'Bonjour' : (targetLanguage === 'english' ? 'Hello' : '¡Hola');
           const hasCurrentLangMemory = langMemory && langMemory.trim() !== '' && langMemory !== 'Чистый лист.' && langMemory !== 'Чистий аркуш.';
           const startPrompt = !hasCurrentLangMemory
             ? `${helloWord}! Я готов к первому уроку.` 
             : `${helloWord}! Продолжим наши занятия.`;
           
           socket.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [{ text: startPrompt }] }], turnComplete: true } }));
           return;
        }

        // Обробка збереження пам'яті (Function Calling) з відповіддю toolResponse
        const functionCalls = responseData.toolCall?.functionCalls || 
          (responseData.serverContent?.modelTurn?.parts ? responseData.serverContent.modelTurn.parts.filter(p => p.functionCall).map(p => p.functionCall) : null);
        
        if (functionCalls && functionCalls.length > 0) {
          functionCalls.forEach(call => {
            if (call.name === "saveStudentProfile" && call.args) {
              if (call.args.global_memory) { 
                globalMemory = call.args.global_memory; 
                localStorage.setItem('global_memory', globalMemory); 
              }
              if (call.args.lang_memory) { 
                langMemory = call.args.lang_memory; 
                localStorage.setItem(`memory_${targetLanguage}`, langMemory); 
              }
              memorySavedSuccessfully = true;

              if (socket && socket.readyState === WebSocket.OPEN && call.id) {
                socket.send(JSON.stringify({
                  toolResponse: {
                    functionResponses: [{
                      response: { output: { status: "success" } },
                      id: call.id
                    }]
                  }
                }));
              }
            }
          });

          if (isExtractingMemory && memorySavedSuccessfully) {
            clearTimeout(stopSessionTimeoutId);
            finalizeStop();
            return;
          }
        }

        if (isExtractingMemory && responseData.serverContent?.turnComplete) {
          if (memorySavedSuccessfully) {
            clearTimeout(stopSessionTimeoutId);
            finalizeStop();
            return;
          }
        }

        if (responseData.serverContent?.interrupted) {
          clearTimeout(watchdogTimer);
          stopBotSpeech();
          currentTutorBubble = null;
          isWaitingForResponse = false;
          statusText.innerText = "Слухаю вас...";
        }

        // Прийом живого тексту з транскрипції Google Gemini Live
        if (responseData.serverContent?.outputTranscription?.text) {
          appendTranscript('tutor', responseData.serverContent.outputTranscription.text);
        }

        if (responseData.serverContent?.modelTurn) {
          clearTimeout(watchdogTimer);
          isWaitingForResponse = false;
          for (const part of responseData.serverContent.modelTurn.parts) {
            if (part.text) {
              appendTranscript('tutor', part.text);
            }
            if (part.inlineData?.mimeType.startsWith("audio/pcm")) {
              playPcmChunk(part.inlineData.data); 
              if (!isBotSpeaking) {
                 isBotSpeaking = true; 
                 avatarCard.classList.add('speaking');
                 btnInterrupt.style.display = "block";
                 statusText.innerText = "Репетитор говорить...";

        if (responseData.serverContent?.turnComplete) {

          isBotSpeaking = false; 
          isWaitingForResponse = false;
          currentTutorBubble = null;
          avatarCard.classList.remove('speaking');
          btnInterrupt.style.display = "none";
          statusText.innerText = "Ваша черга говорити..."; 
        }
      };

      socket.onerror = () => { if (isSessionActive) finalizeStop(); };
      socket.onclose = () => { if (isSessionActive) finalizeStop(); };
    }

    // --- Завершення сесії ---
    function stopSession() {
      if (!isSessionActive) return;
      isExtractingMemory = true;
      stopLessonTimer();
      stopBotSpeech(); 
      currentTutorBubble = null;
      btnAction.disabled = true; 
      btnEndTurn.style.display = "none";
      btnInterrupt.style.display = "none";
      statusText.innerText = "Збереження прогресу...";
      appendTranscript('system', 'Завершення заняття та фіксація прогресу в пам\'яті...');

      if (socket && socket.readyState === WebSocket.OPEN && isSetupComplete) {
        const memoryPrompt = `[СИСТЕМНАЯ ДИРЕКТИВА: Урок завершен. Немедленно вызови функцию saveStudentProfile и передай обновленные факты, предпочтения ученика и языковые ошибки.
СТАРАЯ БАЗА: ${globalMemory || 'пусто'}
СТАРЫЙ ПРОГРЕСС: ${langMemory || 'пусто'}
Объедини предыдущие данные с новыми и вызови функцию. Голосом ничего не говори!]`;
        
        socket.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [{ text: memoryPrompt }] }], turnComplete: true } }));
        
        clearTimeout(stopSessionTimeoutId);
        stopSessionTimeoutId = setTimeout(() => {
          finalizeStop();
        }, 5500);
      } else {
        finalizeStop();
      }
    }

    function finalizeStop() {
      clearTimeout(stopSessionTimeoutId);
      stopSessionTimeoutId = null;
      stopLessonTimer();
      stopBotSpeech();
      currentTutorBubble = null;

      // Повне звільнення мікрофона (індикатор у телефоні гасне)
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (sourceNode) {
        try { sourceNode.disconnect(); } catch(e) {}
        sourceNode = null;
      }
      if (audioContext && audioContext.state === 'running') {
        try { audioContext.suspend(); } catch(e) {}
      }
      // playbackContext усыпляем (не уничтожаем!), чтобы сохранить User Gesture на iOS
      if (playbackContext && playbackContext.state === 'running') {
        try { playbackContext.suspend(); } catch(e) {}
      }

      isSessionActive = false;
      isSetupComplete = false;
      isExtractingMemory = false;
      isWaitingForResponse = false;

      btnAction.disabled = false; 
      btnAction.innerText = "Почати урок"; 
      btnAction.className = "btn-main btn-start";
      btnEndTurn.style.display = "none"; 
      btnInterrupt.style.display = "none";
      statusText.innerText = "Урок та прогрес збережено.";
      appendTranscript('system', 'Урок завершено. Дані збережено.');
      
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.onclose = null; 
        socket.close();
      }
      
      updateUI();
    }

    // --- Відтворення звуку ---
    function playPcmChunk(base64Audio) {
      if (!playbackContext) return;
      
      const raw = window.atob(base64Audio); 
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      
      const int16Array = new Int16Array(bytes.buffer); 
      const float32Array = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) float32Array[i] = int16Array[i] / 32768;
      
      const audioBuffer = playbackContext.createBuffer(1, float32Array.length, 24000); 
      audioBuffer.getChannelData(0).set(float32Array);
      
      const source = playbackContext.createBufferSource(); 
      source.buffer = audioBuffer; 
      source.connect(playbackContext.destination);
      
      const currentTime = playbackContext.currentTime;
      if (scheduledPlayTime < currentTime) {
        scheduledPlayTime = currentTime + 0.04; 
      }
      
      source.start(scheduledPlayTime); 
      scheduledPlayTime += audioBuffer.duration;
      
      activeAudioSources.push(source); 
      source.onended = () => { 
        activeAudioSources = activeAudioSources.filter(s => s !== source); 
      };
    }
  </script>
